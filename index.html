<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小克記帳">
<meta name="application-name" content="小克記帳">
<meta name="theme-color" content="#232538">
<title>小克記帳</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#FBF9F6;color:#232536;font:16px/1.45 -apple-system,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #D95367;outline-offset:2px}
.hero :focus-visible{outline-color:#fff}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100dvh;background:#FBF9F6;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.num,.big,#amount{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums}

/* 方案 A：日系柔和微光頂部欄（深邃夜空靛藍 + 暖杏桃色環境柔光） */
.hero{
  position:relative;overflow:hidden;
  background:
    radial-gradient(130px 100px at 82% 58px, rgba(255,184,150,.18), transparent 75%),
    radial-gradient(220px 160px at 15% 10%, rgba(132,148,220,.12), transparent 80%),
    linear-gradient(180deg, #1E2034 0%, #252840 100%);
  color:#F9F6F2;
  padding:calc(env(safe-area-inset-top) + 18px) 18px 26px;
  border-radius:0 0 32px 32px;
  box-shadow:0 10px 28px -10px rgba(24,26,44,.22);
}
.heroTop{position:relative;z-index:1;display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.04em}
.sub{font-size:13.5px;color:rgba(249,246,242,.78);text-align:right;white-space:pre-line}
#banner{margin:12px 16px 0;background:#FFF1CC;color:#4A3A00;border-radius:12px;padding:10px 12px;font-size:14px}

/* 方案 C：小克的專屬像素微景觀小角落（支援 4 大時段 + 8 種天氣 + 12 種日常行為） */
.petRoom{
  position:relative;width:142px;height:108px;flex:none;
  border-radius:20px;
  background:
    radial-gradient(circle at 52% 58%, rgba(255,190,158,.25) 0%, rgba(255,190,158,.05) 58%, transparent 78%),
    linear-gradient(180deg, rgba(20,23,40,.65) 0%, rgba(36,34,54,.72) 72%, rgba(66,49,58,.85) 72%, rgba(52,38,47,.92) 100%);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15), 0 8px 20px rgba(12,14,24,.28);
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:9px;overflow:hidden;
  transition:background .55s ease, border-color .55s ease;
}
/* 隨真實時間變化的 4 大時段基底（日出、白天、日落、夜晚） */
.petRoom[data-tod="sunrise"]{
  background:
    radial-gradient(circle at 28% 32%, rgba(255,204,165,.38) 0%, transparent 65%),
    linear-gradient(180deg, rgba(82,78,128,.62) 0%, rgba(168,112,126,.68) 72%, rgba(92,62,64,.88) 72%, rgba(68,45,49,.94) 100%);
  border-color:rgba(255,222,205,.22);
}
.petRoom[data-tod="day"]{
  background:
    radial-gradient(circle at 30% 25%, rgba(255,244,214,.38) 0%, transparent 65%),
    linear-gradient(180deg, rgba(64,104,158,.58) 0%, rgba(88,118,162,.66) 72%, rgba(112,78,66,.88) 72%, rgba(86,58,49,.94) 100%);
  border-color:rgba(255,255,255,.22);
}
.petRoom[data-tod="sunset"]{
  background:
    radial-gradient(circle at 35% 35%, rgba(255,156,118,.4) 0%, transparent 68%),
    linear-gradient(180deg, rgba(78,52,96,.68) 0%, rgba(156,82,92,.74) 72%, rgba(84,52,58,.9) 72%, rgba(62,38,44,.95) 100%);
  border-color:rgba(255,195,170,.22);
}
.petRoom[data-tod="night"]{
  background:
    radial-gradient(circle at 52% 58%, rgba(255,190,158,.24) 0%, rgba(255,190,158,.05) 58%, transparent 78%),
    linear-gradient(180deg, rgba(18,21,38,.72) 0%, rgba(34,32,52,.78) 72%, rgba(64,47,56,.88) 72%, rgba(48,35,44,.94) 100%);
}
.petRoom[data-act="pc"] .roomGlow{
  right:28px;top:38px;width:48px;height:36px;
  background:radial-gradient(circle, rgba(120,210,255,.38) 0%, rgba(120,210,255,.08) 60%, transparent 78%);
}
.roomBg{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block;z-index:1;
}
.roomFg{
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;display:block;z-index:3;
}
.roomGlow{
  position:absolute;right:14px;top:16px;width:28px;height:28px;border-radius:50%;
  background:radial-gradient(circle, rgba(255,216,155,.42) 0%, rgba(255,180,130,.12) 55%, transparent 75%);
  pointer-events:none;animation:lampPulse 3.6s ease-in-out infinite;z-index:1;
}
.petRoom[data-tod="day"] .roomGlow{
  left:10px;right:auto;top:8px;width:44px;height:44px;
  background:radial-gradient(circle, rgba(255,246,190,.55) 0%, rgba(255,220,140,.18) 60%, transparent 78%);
}
.petRoom[data-tod="sunrise"] .roomGlow{
  left:12px;right:auto;top:14px;width:38px;height:38px;
  background:radial-gradient(circle, rgba(255,200,150,.48) 0%, rgba(255,160,120,.15) 60%, transparent 78%);
}
@keyframes lampPulse{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.15);opacity:1}}

/* 小房間天氣與道具像素動畫 */
.rain-d1{animation:rainFall .7s linear infinite}
.rain-d2{animation:rainFall .7s linear -.35s infinite}
@keyframes rainFall{0%{transform:translate(1px,-4px);opacity:0}20%{opacity:.85}85%{opacity:.85}100%{transform:translate(-2px,14px);opacity:0}}
.snow-f1{animation:snowFall 2.3s ease-in-out infinite}
.snow-f2{animation:snowFall 2.3s ease-in-out -1.15s infinite}
@keyframes snowFall{0%{transform:translate(0,-3px);opacity:0}20%{opacity:.95}50%{transform:translate(1px,5px)}85%{opacity:.95}100%{transform:translate(-1px,13px);opacity:0}}
.sakura-p1{animation:sakuraFall 2.6s ease-in-out infinite}
.sakura-p2{animation:sakuraFall 2.6s ease-in-out -1.3s infinite}
@keyframes sakuraFall{0%{transform:translate(2px,-3px);opacity:0}20%{opacity:.95}60%{transform:translate(-2px,6px)}85%{opacity:.95}100%{transform:translate(-4px,13px);opacity:0}}
.leaf-f1{animation:sakuraFall 2.4s ease-in-out infinite}
.leaf-f2{animation:sakuraFall 2.4s ease-in-out -1.2s infinite}
.lightning-flash{animation:thunderFlash 4.2s infinite}
@keyframes thunderFlash{0%,91%,95%,98%,100%{opacity:0}92%,96%{opacity:.92}}
.meteor-fly{animation:meteorFly 3.4s ease-in infinite}
@keyframes meteorFly{0%,70%{transform:translate(4px,-4px);opacity:0}76%{opacity:1}92%{transform:translate(-14px,12px);opacity:0}100%{opacity:0}}
.firefly-glow{animation:fireflyFloat 2.4s ease-in-out infinite alternate}
@keyframes fireflyFloat{0%{transform:translate(0,1px);opacity:.25}50%{opacity:1}100%{transform:translate(2px,-2px);opacity:.4}}
.steam-w1{animation:steamUp 1.9s ease-out infinite}
.steam-w2{animation:steamUp 1.9s ease-out -.95s infinite}
@keyframes steamUp{0%{transform:translateY(1px);opacity:0}35%{opacity:.88}100%{transform:translateY(-5px);opacity:0}}
.pc-glow{animation:pcFlicker 1.8s steps(2,end) infinite}
@keyframes pcFlicker{0%,100%{opacity:.92}50%{opacity:.65}}
.sun-ray{animation:sunBeat 3.2s ease-in-out infinite}
@keyframes sunBeat{0%,100%{opacity:.55}50%{opacity:.9}}
.dumbbell-lift{animation:liftUp .95s ease-in-out infinite alternate}
@keyframes liftUp{0%{transform:translateY(1px)}100%{transform:translateY(-3px)}}
.note-float{animation:steamUp 2.2s ease-in-out infinite}
.Bubble-bath{animation:steamUp 2.5s ease-in-out infinite}

/* 小餅乾與房間場景互動列（玻璃膠囊感） */
.petCareBar{position:relative;z-index:1;display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:-4px;margin-bottom:8px;flex-wrap:wrap}
.sceneBtn,.cookieBtn{
  border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);color:#F9F6F2;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  border-radius:999px;padding:4px 10px;font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;gap:4px;
  transition:transform .15s ease, background .2s;
}
.sceneBtn:active,.cookieBtn:active{transform:scale(.95)}
.cookieBtn.has{background:rgba(255,238,204,.92);color:#5C3409;border-color:rgba(242,183,49,.6);box-shadow:0 3px 12px rgba(242,183,49,.22);animation:pop .35s ease-out}

/* 記帳頁玻璃分段按鈕、金額輸入、計算列與首頁溫柔提醒卡 */
.seg{position:relative;z-index:1;display:flex;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:3px;gap:3px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:11px;color:rgba(249,246,242,.72);font-weight:700;transition:all .18s ease}
.seg button.on{background:#FFFDFB;color:#1F2235;box-shadow:0 2px 8px rgba(12,14,24,.18)}
.cur{margin-top:9px}
.cur button.on[data-v="HKD"]{background:linear-gradient(135deg,#E25B6E,#D14358);color:#fff}
.cur button.on[data-v="CNY"]{background:linear-gradient(135deg,#F0B849,#E0A02E);color:#202336}

.amountRow{position:relative;z-index:1;display:flex;align-items:baseline;gap:10px;margin-top:18px}
.amountRow span{font-size:26px;font-weight:700;color:#FF8E9E;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif}
body.cny .amountRow span{color:#F3C262}
#amount{width:100%;border:0;border-bottom:2px solid rgba(255,255,255,.2);background:transparent;color:#FFFDFB;font-size:48px;font-weight:700;padding:0 0 6px;border-radius:0;outline:none;caret-color:#FF8E9E}
#amount::placeholder{color:rgba(255,255,255,.24)}
#amount:focus{border-bottom-color:#FF8E9E}
body.cny #amount:focus{border-bottom-color:#F3C262}

.calcBar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:9px;min-height:28px}
.calcOps{display:flex;gap:6px}
.calcOps button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.09);color:#F9F6F2;border-radius:9px;padding:3px 11px;font-size:14px;font-weight:700}
.calcOps button:active{background:rgba(255,255,255,.24)}
#calcHint{font-size:13.5px;color:#F3C262;font-weight:700}

.alertCard{background:linear-gradient(135deg,#FFFDFB,#FFF4EC);border:1px solid #F3D9C6;border-radius:18px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 4px 14px rgba(180,83,47,.06)}
.alertCard b{display:block;font-size:14px;color:#8C3B20;margin-bottom:2px}
.alertCard span{font-size:12.5px;color:#6E5A4F;display:block}
.alertCard .acts{display:flex;gap:6px;flex:none}
.alertCard button{border:0;border-radius:10px;padding:7px 11px;font-size:12.5px;font-weight:700;background:#D96B43;color:#fff}
.alertCard button.sec{background:#F2E8DF;color:#6E5A4F}

/* 搜尋與篩選 */
.filterBar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.searchInput{flex:1;border:1px solid #EAE3DC;border-radius:12px;padding:9px 13px;font-size:14px;background:#FBF9F6}
.filterChips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;scrollbar-width:none}
.filterChips::-webkit-scrollbar{display:none}
.fchip{border:1px solid #EAE3DC;background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap;color:#6E6A7C}
.fchip.on{background:#25283D;border-color:#25283D;color:#fff}
.filterSum{font-size:13px;color:#B4532F;background:#FFF5EB;border-radius:10px;padding:8px 12px;margin-bottom:10px;font-weight:700;display:flex;justify-content:space-between}

/* 日期快捷選擇列（昨天 / 今天 / 點開可選日期） */
.dateQuickBar{display:grid;grid-template-columns:1fr 1fr 1.35fr;gap:8px}
.dqBtn{border:1px solid #EAE3DC;background:#FFFFFF;border-radius:14px;padding:10px 6px;font-size:14px;font-weight:700;color:#4E4B5C;text-align:center;box-shadow:0 2px 5px rgba(35,37,54,.02);transition:all .15s ease;width:100%}
.dqBtn span{display:block;font-size:11px;font-weight:500;color:#8C889A;margin-top:2px}
.dqBtn.on{background:#25283D;border-color:#25283D;color:#fff;box-shadow:0 4px 10px rgba(37,40,61,.18)}
.dqBtn.on span{color:rgba(255,255,255,.8)}
.datePickWrap{position:relative;display:block}
.dateNativeInput{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;border:0;margin:0;padding:0}

/* 報表年月切換與月份選擇器工具列 */
.repTopBar{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:6px;flex-wrap:wrap}
.repModeSwitch{display:inline-flex;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px;gap:2px}
.repModeSwitch button{border:0;background:transparent;color:rgba(249,246,242,.75);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:700;transition:all .15s}
.repModeSwitch button.on{background:#FFFDFB;color:#1F2235;box-shadow:0 2px 6px rgba(12,14,24,.2)}
.monthPickLabel{position:relative;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.1);color:#F9F6F2;border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:700;cursor:pointer}
.monthPickLabel input[type="month"]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}

/* 報表分類預算進度與設定頁分類預算網格 */
.catBudBlock{padding:9px 0;border-bottom:1px solid #F4EFE9}
.catBudBlock:last-child{border-bottom:0}
.cbBar{height:7px;background:#F1ECE6;border-radius:999px;overflow:hidden;margin-top:5px}
.cbFill{display:block;height:100%;border-radius:999px;transition:width .4s ease}
.cbMeta{display:flex;justify-content:space-between;font-size:12px;color:#726E80;margin-top:4px}
.cbMeta b.over{color:#B91C1C}
.cbMeta b.warn{color:#B45309}
.cbMeta b.ok{color:#15803D}
.catBudGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.catBudItem{display:flex;align-items:center;justify-content:space-between;gap:6px;background:#FBF9F6;border:1px solid #EAE3DC;border-radius:12px;padding:7px 10px}
.catBudItem span.cn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catBudItem input{width:78px;border:1px solid #DFD7CE;border-radius:8px;padding:5px 7px;background:#fff;text-align:right;font-size:13.5px;font-family:ui-rounded,"SF Pro Rounded",sans-serif}

/* 房間內定情信物徽章 */
.roomGiftBadge{position:absolute;left:7px;bottom:6px;z-index:4;background:rgba(255,250,245,.9);border:1px solid rgba(226,91,110,.45);border-radius:999px;padding:1px 6px;font-size:12px;line-height:1.3;box-shadow:0 2px 6px rgba(18,20,34,.22);pointer-events:none}

/* 週期性固定收支列表 */
.recRow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid #F2ECE6;font-size:14px}
.recRow:last-child{border-bottom:0}
.recRow b{font-weight:700}
.recRow i{font-style:normal;color:#726E80;font-size:12px;margin-left:6px}

/* body 溫暖紙張底色與空氣感卡片 */
.body{padding:20px 16px 0}
.lbl{font-size:13.5px;color:#726E80;margin:0 0 8px;font-weight:600;letter-spacing:.02em}
.block{margin-top:20px}
#chips,#quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #ECE6DF;background:#FFFFFF;border-radius:999px;padding:9px 15px 9px 12px;font-weight:600;box-shadow:0 2px 6px rgba(35,37,54,.03);transition:all .15s ease}
.dot{width:10px;height:10px;border-radius:50%;background:#999;flex:none}
.chip.on{background:#25283D;border-color:#25283D;color:#fff;box-shadow:0 4px 12px rgba(37,40,61,.18)}
.txt{display:block;width:100%;border:1px solid #EAE3DC;border-radius:14px;padding:12px 14px;background:#FFFFFF;min-height:46px;box-shadow:0 2px 6px rgba(35,37,54,.02)}
#quick{margin-top:10px}
.q{border:1px solid transparent;background:#F1ECE6;border-radius:999px;padding:7px 14px;font-weight:600;font-size:14.5px}
.q.on{background:#25283D;color:#fff}
.q.add{background:transparent;border:1px dashed #B5B0C0;color:#726E80;font-weight:500}
.primary{width:100%;margin-top:24px;border:0;border-radius:18px;background:linear-gradient(135deg,#E25B6E,#D14358);color:#fff;font-weight:800;font-size:18px;padding:16px;letter-spacing:.06em;box-shadow:0 8px 20px -4px rgba(212,70,90,.35)}
body.cny .primary{background:linear-gradient(135deg,#F0B849,#E0A02E);color:#202336;box-shadow:0 8px 20px -4px rgba(224,160,46,.32)}
.ghost{border:1px solid #EAE3DC;background:#FFFFFF;border-radius:14px;padding:10px 14px;font-weight:600;color:#393B4E;box-shadow:0 2px 6px rgba(35,37,54,.02)}
.danger{border:1px solid #EBC2C2;background:#FFFDFD;color:#B91C1C;border-radius:14px;padding:10px 14px;font-weight:600}
#editBar{display:flex;gap:10px;margin-top:12px}
#editBar button{flex:1}
.wide{width:100%;margin-top:12px}

/* report */
.nav{position:relative;z-index:1;display:flex;align-items:center;justify-content:space-between;margin:14px 0 0}
.nav .lab{font-weight:700;font-size:17px;text-align:center;flex:1}
.nav button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.09);color:#fff;width:40px;height:40px;border-radius:50%;font-size:22px;line-height:1}
.today{position:relative;z-index:1;display:block;margin:4px auto 0;border:0;background:none;color:#F3C262;font-weight:700;padding:6px}
.k2{position:relative;z-index:1;font-size:14px;color:rgba(255,255,255,.7);margin-top:16px}
.big{position:relative;z-index:1;font-size:44px;font-weight:800;line-height:1.1;margin-top:2px}
.trio{position:relative;z-index:1;display:flex;gap:28px;margin-top:12px}
.trio span{display:block;font-size:13px;color:rgba(255,255,255,.7)}
.trio b{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums;font-size:18px}
.note{position:relative;z-index:1;margin-top:12px;font-size:14px;color:#F3C262}
.bars{position:relative;z-index:1;display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:20px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bar{width:100%;border:0;background:linear-gradient(180deg,#FF9AA8,#E25B6E);border-radius:4px 4px 0 0;padding:0;min-height:3px}
.bar.zero{background:rgba(255,255,255,.15)}
.axis{position:relative;z-index:1;display:flex;gap:3px;margin-top:5px}
.axis span{flex:1;height:14px;position:relative}
.axis i{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:rgba(255,255,255,.62);white-space:nowrap}

.panel{background:#FFFFFF;border:1px solid #F0EAE3;border-radius:22px;padding:16px;margin-bottom:14px;box-shadow:0 4px 16px rgba(35,37,54,.03)}
h2{font-size:16px;margin:0 0 12px;font-weight:700;color:#232536}
.ribbon{display:flex;gap:3px;height:16px;border-radius:8px;overflow:hidden;margin-bottom:14px}
.ribbon i{display:block;min-width:4px}
.lg{display:flex;align-items:center;gap:10px;padding:7px 0}
.lg .n{flex:1;font-weight:600}
.lg .p{color:#726E80;font-size:14px;min-width:38px;text-align:right}
.lg .a{min-width:96px;text-align:right;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
.gh{display:flex;justify-content:space-between;font-size:13px;color:#726E80;margin:16px 0 2px;font-weight:600}
.gh:first-of-type{margin-top:0}
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid #F3EEE8}
.row:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:50%;background:#667089;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.rc{flex:1;min-width:0}
.rc b{display:block;font-weight:700}
.rc i{display:block;font-style:normal;font-size:13px;color:#726E80;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{text-align:right;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums}
.ra b{display:block;font-weight:700}
.ra i{display:block;font-style:normal;font-size:12px;color:#9A6520}
.ra.income b{color:#15803D}
.empty{color:#726E80;text-align:center;padding:18px 8px}

/* settings */
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line input,.add input{border:1px solid #EAE3DC;border-radius:11px;padding:9px 11px;background:#FBF9F6}
.line input{width:110px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif}
.help{font-size:13px;color:#726E80;margin-top:10px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid #EAE3DC;border-radius:999px;padding:5px 6px 5px 12px;background:#FBF9F6;font-size:15px}
.tag button{border:0;background:#EAE4DC;border-radius:50%;width:22px;height:22px;line-height:1;padding:0;color:#6E6A7C}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0}
.pick .chip{padding:7px 12px 7px 10px;font-size:15px}

/* tab bar 空氣感磨砂底欄 */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(251,249,246,.88);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-top:1px solid rgba(232,224,215,.8);padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabbar div{max-width:520px;margin:0 auto;display:flex}
.tabbar button{position:relative;flex:1;border:0;background:transparent;padding:9px 4px 8px;color:#8C889A;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px;transition:color .2s}
.tabbar svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:#D95367}
.tabbar .dot2{position:absolute;top:7px;left:calc(50% + 9px);width:10px;height:10px;border-radius:50%;background:#D95367;border:2px solid #FBF9F6}
#toast{white-space:pre-line;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(34,37,58,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#F9F6F2;border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 18px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;box-shadow:0 8px 24px rgba(25,27,44,.28);z-index:60}
#toast.show{opacity:1}

/* 小克與小房間內定位 */
.petTop{align-items:center}
.petTop .sub{text-align:left;white-space:pre-line;margin-top:6px;line-height:1.55}
.pet{position:relative;z-index:2;border:0;background:none;padding:0;width:104px;flex:none;border-radius:14px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pet svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;animation:bob 2s ease-in-out infinite;filter:drop-shadow(0 3px 6px rgba(15,14,26,.35))}
.pet.nervous svg{animation:bob 1.1s ease-in-out infinite}
.pet.sleep svg{animation:breathe 3.4s ease-in-out infinite}
.pet.full1 svg,.pet.full2 svg,.pet.full3 svg{animation:sway 2.4s ease-in-out infinite}
.aL,.aR,.ey,.bub2{transform-box:fill-box}
.aL{transform-origin:100% 0}
.aR{transform-origin:0 0}
.ey{transform-origin:50% 50%}
.bub2{transform-origin:0 100%}
.gz{transition:transform .18s ease-out}
.pet.look-l .gz{transform:translateX(-1px)}
.pet.look-r .gz{transform:translateX(1px)}
.pet.look-u .gz{transform:translateY(-1px)}
.pet.look-d .gz{transform:translateY(1px)}
.pet .ey.bl{animation:blink 4.6s ease-in-out infinite}

/* 動作 */
.pet.a-jump svg{animation:jump .65s ease-out}
.pet.a-jiggle svg{animation:jig .65s ease-out}
.pet.a-cheer svg{animation:hop2 .6s ease-out 3}
.pet.a-cheer .aL,.pet.a-stretch .aL{animation:armL 1.8s ease-in-out}
.pet.a-cheer .aR,.pet.a-stretch .aR{animation:armR 1.8s ease-in-out}
.pet.a-wave .aR{animation:wave 1.9s ease-in-out}
.pet.a-dance svg{animation:dance 1.3s ease-in-out 2}
.pet.a-dance .aL{animation:danceL 1.3s ease-in-out 2}
.pet.a-dance .aR{animation:danceR 1.3s ease-in-out 2}
.pet.a-stretch svg,.pet.a-yawn svg{animation:stretch 1.8s ease-in-out}
.pet.a-sing svg{animation:sing 1.35s ease-in-out 2}
.pet.a-turn svg{animation:turn 1s ease-in-out}
.pet.a-stroll{animation:stroll 2.6s ease-in-out}
.pet.a-stroll .lg1,.pet.a-stroll .lg2{animation:step .34s linear infinite}
.pet.a-stroll .lg2{animation-delay:-.17s}
.pet.a-shiver svg{animation:shiver .1s linear 12}
.pet.a-sigh svg{animation:sigh 1.8s ease-in-out}
.pet.a-snore svg{animation:snore 1.6s ease-in-out}
.pet.a-waddle svg{animation:waddle .9s ease-in-out 2}
.pet.a-dizzy svg{animation:dizzy 1.8s ease-in-out}
.pet.a-think svg{animation:tilt 2.3s ease-in-out}

/* 特效 */
.fxz{animation:zf 2.4s ease-in-out infinite}
.bub2{animation:bubl 3s ease-in-out infinite}
.burp{animation:bp 2.8s ease-in-out infinite}
.drip{animation:drip 1.4s ease-in infinite}
.rise{animation:rise 1.7s ease-out infinite}
.coin{animation:cf .9s ease-in infinite}
.tw{animation:tw 1.1s ease-in-out infinite}
.dd{animation:dd 1.8s ease-in-out infinite}
.orb1{animation:orb 1s ease-in-out infinite alternate}
.orb2{animation:orb 1s ease-in-out infinite alternate-reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0) scale(1.1,.88)}35%{transform:translateY(-24%) scale(.94,1.08)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@keyframes jig{0%{transform:scale(1)}20%{transform:scale(1.14,.86)}45%{transform:scale(.92,1.1)}70%{transform:scale(1.05,.96)}100%{transform:scale(1)}}
@keyframes hop2{0%{transform:translateY(0) scale(1.06,.92)}40%{transform:translateY(-18%) scale(.96,1.05)}80%,100%{transform:none}}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-8%) rotate(-7deg)}50%{transform:none}75%{transform:translateY(-8%) rotate(7deg)}}
@keyframes danceL{0%,50%,100%{transform:none}25%{transform:rotate(130deg)}}
@keyframes danceR{0%,50%,100%{transform:none}75%{transform:rotate(-130deg)}}
@keyframes armL{0%,100%{transform:none}15%,45%,85%{transform:rotate(155deg)}30%,60%{transform:rotate(172deg)}}
@keyframes armR{0%,100%{transform:none}15%,45%,85%{transform:rotate(-155deg)}30%,60%{transform:rotate(-172deg)}}
@keyframes wave{0%,100%{transform:none}12%,36%,60%,84%{transform:rotate(-128deg)}24%,48%,72%{transform:rotate(-156deg)}}
@keyframes stretch{0%,100%{transform:none}30%,70%{transform:scale(.9,1.17)}}
@keyframes sing{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) translateY(-3%)}75%{transform:rotate(5deg) translateY(-3%)}}
@keyframes turn{0%,100%{transform:scaleX(1)}35%,55%{transform:scaleX(.06)}}
@keyframes stroll{0%,100%{transform:none}30%,60%{transform:translateX(-18px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes sigh{0%,100%{transform:none}40%,70%{transform:scale(1.04,.9)}}
@keyframes snore{0%,100%{transform:scale(1)}45%{transform:scale(1.06,.96)}}
@keyframes waddle{0%,100%{transform:rotate(-5deg) translateX(-2%)}50%{transform:rotate(5deg) translateX(2%)}}
@keyframes dizzy{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(5deg)}}
@keyframes tilt{0%,100%{transform:none}25%,75%{transform:rotate(-8deg)}}
@keyframes zf{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes bp{0%,100%{opacity:0}40%,70%{opacity:.95}}
@keyframes bubl{0%{transform:scale(.3);opacity:0}30%{opacity:1}80%{transform:scale(1.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes drip{0%{transform:translateY(-1px);opacity:0}30%{opacity:1}100%{transform:translateY(2px);opacity:0}}
@keyframes rise{0%{transform:translateY(2px);opacity:0}20%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes cf{0%{transform:translateY(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes dd{0%,15%{opacity:0}35%,85%{opacity:1}100%{opacity:0}}
@keyframes orb{from{transform:translateX(-6px)}to{transform:translateX(6px)}}

/* 方案 A：溫潤微透奶油對話框 */
.bubble{
  position:relative;z-index:2;
  background:rgba(255,252,249,.95);
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border:1px solid rgba(255,228,214,.7);
  color:#252738;border-radius:18px;padding:12px 16px 13px;margin:4px 0 16px;
  font-size:14.5px;line-height:1.58;
  box-shadow:0 8px 24px -4px rgba(18,20,34,.22);
}
.bubble::before{content:"";position:absolute;top:-8px;right:52px;border:8px solid transparent;border-top:0;border-bottom-color:rgba(255,252,249,.95)}
.bubble .bn{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:#C2593F;font-weight:800;margin-bottom:3px;letter-spacing:.03em}
.bubble .bn::before{content:"";width:6px;height:6px;border-radius:50%;background:#E2725B;display:inline-block}
.bubble.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

/* achievements */
.lv{position:relative;z-index:1;display:flex;align-items:center;gap:10px;margin-top:6px}
.lvb{background:linear-gradient(135deg,#E27D5F,#C96547);color:#fff;font-weight:800;border-radius:8px;padding:2px 9px;font-size:14px}
.lvt{font-size:22px;font-weight:800}
.pbar{position:relative;z-index:1;height:11px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;margin-top:16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#E8836B,#F3C262);border-radius:999px;transition:width .6s}
.pnote{position:relative;z-index:1;margin-top:8px;font-size:13.5px;color:rgba(249,246,242,.74)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acard{border:1px solid #F0EAE3;background:#fff;border-radius:18px;border-top:4px solid var(--c);padding:14px 6px 10px;min-height:116px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;box-shadow:0 3px 10px rgba(35,37,54,.03)}
.acard .ai{font-size:32px;line-height:1.15}
.acard b{font-size:13px;font-weight:700;line-height:1.3}
.acard i{font-style:normal;font-size:11px;color:#726E80}
.acard.lock{background:#F1ECE6;border-color:#E6DFD7;border-top-color:#D2C9BF;box-shadow:none}
.acard.lock .ai,.acard.lock b{color:#9B95A6}
.acard.lock .ai{font-weight:800;font-size:30px}

.achTop{position:relative;z-index:1;display:flex;align-items:center;gap:12px}
.achPet{width:104px}
.skins{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.skin{border:1.5px solid #EFEAE3;background:#FBF9F6;border-radius:16px;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.skin.on{border-color:#D97757;background:#FFF4EC;box-shadow:0 3px 10px rgba(217,119,87,.12)}
.skin svg{display:block;width:100%;height:auto}
.skin b{font-size:11px;font-weight:700;line-height:1.25}
.skin i{font-style:normal;font-size:10px;color:#726E80}
.skin.lock{background:#EFEAE4;border-color:transparent}
.skin.lock .q2{font-size:26px;font-weight:800;color:#9B95A6;height:34px;display:grid;place-items:center}
.skin.lock b{color:#9B95A6}
.achPair{display:flex;align-items:flex-end;gap:8px;flex:none}
.achPair .pet{width:88px}
.nextPet{opacity:.48;filter:grayscale(.35)}
.nextPet::after{content:"NEXT";display:block;margin-top:-3px;font-size:9px;font-weight:800;letter-spacing:.08em;color:rgba(255,255,255,.72)}

/* 圖鑑實驗室 */
.labBtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid #F2C8CE;background:linear-gradient(135deg,#FFF7F8,#FFF0F2);border-radius:14px;padding:13px 14px;font-weight:800;color:#42252B}
.labBtn span:last-child{font-size:20px;color:#D95367}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.gskin{background:#FBF9F6;border:1px solid #EDE6DF;border-radius:12px;padding:10px 6px;min-width:0}
.gskin .pet{width:92px;margin:0 auto;display:block}
.gskin b,.gskin i{display:block}.gskin b{font-size:13px}.gskin i{font-size:11px;color:#726E80;font-style:normal}
.gskin.locked{background:#F2EEE9}.gskin.locked b::after{content:" · 未解鎖";color:#B91C1C;font-size:10px}
.galleryAch{text-align:left;margin-top:18px}
.galleryAch .ga{display:flex;gap:10px;align-items:center;border-top:1px solid #F2ECE6;padding:10px 2px}
.galleryAch .ga span{font-size:26px}.galleryAch .ga div{min-width:0}.galleryAch .ga b,.galleryAch .ga i{display:block}.galleryAch .ga i{font-style:normal;color:#726E80;font-size:12px}

/* 服裝固定在身體上，只有尾巴、裙擺、法杖等配件獨立活動 */
/* 修正：將 .cat-tail 的 transform-origin 設為左下方 (0% 100%)，讓尾巴根部緊貼小克身體右側搖擺，不會錯位懸空 */
.pet svg .scarf-tail,.pet svg .cat-tail,.pet svg .maid-bow,.pet svg .magic-star,.pet svg .detective-glass,.pet svg .angel-wing{transform-box:fill-box}
.scarf-tail{transform-origin:50% 0%;animation:scarfTail 1.35s ease-in-out infinite}
.cat-tail{transform-origin:0% 100%;animation:catTail 1.7s ease-in-out infinite}
.maid-bow{transform-origin:50% 50%;animation:maidBow 1.8s ease-in-out infinite}
.magic-star{transform-origin:50% 50%;animation:magicStar 1.15s ease-in-out infinite}
.detective-glass{transform-origin:0 100%;animation:glassScan 2.6s ease-in-out infinite}
.angel-wing{transform-origin:50% 50%;animation:wingBeat 1.5s ease-in-out infinite}
@keyframes scarfTail{0%,100%{transform:rotate(0)}50%{transform:rotate(8deg)}}
@keyframes catTail{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(12deg)}}
@keyframes maidBow{0%,100%{transform:scale(1)}50%{transform:scale(1.18,.9)}}
@keyframes magicStar{0%,100%{transform:scale(.65) rotate(0);opacity:.45}50%{transform:scale(1.25) rotate(45deg);opacity:1}}
@keyframes glassScan{0%,55%,100%{transform:rotate(0)}70%{transform:rotate(-15deg)}85%{transform:rotate(10deg)}}
@keyframes wingBeat{0%,100%{transform:scaleX(1)}50%{transform:scaleX(.7)}}

/* 各形象的招牌待機動作 */
.pet.a-scarfpose svg{animation:scarfPose 1.8s ease-in-out}
.pet.a-catplay svg{animation:catPlay 1.7s ease-in-out}
.pet.a-curtsy svg{animation:curtsy 1.9s ease-in-out}
.pet.a-cast svg{animation:cast 2.1s ease-in-out}
.pet.a-inspect svg{animation:inspect 2.2s ease-in-out}
.pet.a-march svg{animation:march 1.7s ease-in-out}
.pet.a-soar svg{animation:soar 2.3s ease-in-out}
@keyframes scarfPose{0%,100%{transform:none}25%{transform:rotate(-8deg)}55%{transform:translateY(-12%) rotate(7deg)}75%{transform:rotate(-4deg)}}
@keyframes catPlay{0%,100%{transform:none}22%{transform:translateX(-8%) rotate(-8deg)}45%{transform:translateY(-20%) scale(.92,1.1)}68%{transform:translateX(8%) rotate(8deg)}82%{transform:scale(1.1,.9)}}
@keyframes curtsy{0%,100%{transform:none}30%{transform:translateY(5%) rotate(-6deg)}55%{transform:scale(1.08,.9)}78%{transform:translateY(-8%) rotate(5deg)}}
@keyframes cast{0%,100%{transform:none;filter:none}25%{transform:rotate(-8deg)}50%{transform:translateY(-14%) rotate(8deg);filter:drop-shadow(0 0 5px #F2B731)}75%{transform:rotate(-5deg)}}
@keyframes inspect{0%,100%{transform:none}20%{transform:translateX(-7%) rotate(-5deg)}48%{transform:translateX(7%) rotate(5deg)}70%{transform:scale(.96,1.06)}85%{transform:rotate(-3deg)}}
@keyframes march{0%,100%{transform:none}25%{transform:translate(-5%,-8%) rotate(-5deg)}50%{transform:none}75%{transform:translate(5%,-8%) rotate(5deg)}}
@keyframes soar{0%,100%{transform:none;filter:none}35%{transform:translateY(-20%) rotate(-4deg);filter:drop-shadow(0 0 5px #fff)}70%{transform:translateY(-12%) rotate(5deg)}}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(28,32,56,.64);display:grid;place-items:center;padding:20px}
.mcard{position:relative;background:#fff;border-radius:24px;padding:22px 20px 20px;width:100%;max-width:340px;max-height:88dvh;overflow:auto;text-align:center;animation:mpop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.mtag{font-size:14px;font-weight:700;color:#667089}
.micon{width:96px;height:96px;margin:14px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:color-mix(in srgb,var(--c) 16%,#fff);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 38%,#fff)}
.mcard.fresh .micon{animation:shine 1.4s ease-out}
@keyframes shine{0%{transform:scale(.4) rotate(-40deg)}60%{transform:scale(1.15) rotate(8deg)}100%{transform:none}}
.mname{font-size:21px;font-weight:800}
.mdesc{font-size:14px;color:#667089;margin-top:2px}
.msay{display:flex;gap:10px;align-items:center;text-align:left;background:#FFF1E8;border-radius:14px;padding:10px 12px;margin-top:16px;font-size:15px;line-height:1.45}
.mpet{width:56px;flex:none}
.mpet svg{display:block;width:100%;height:auto}
.mrest{margin-top:14px;font-size:13px;color:#667089;text-align:left}
.mrest span{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;background:#F0F2F7;color:#1C2038}
.mok{margin-top:18px;padding:13px}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns button{flex:1;margin:0}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  #toast{transition:none}
  .pet,.pet svg,.pet svg *,.mcard,.mcard .micon,.bubble.pop,.pbar i,.roomGlow{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="banner" hidden>目前無法儲存資料，關閉分頁後記錄會消失。請使用手機 Safari 或 Chrome 等瀏覽器開啟。</div>

  <!-- 記帳主頁 -->
  <section id="tab-add">
    <div class="hero">
      <div class="heroTop petTop">
        <div><h1 id="title">記帳</h1><div class="sub num" id="sub"></div></div>
        <!-- 方案 C：小克的專屬像素微景觀小房間（真實時段 × 季節天氣 × 日常活動） -->
        <div class="petRoom" id="petRoom" data-tod="night" data-weather="clear" data-act="idle" aria-hidden="false">
          <div class="roomGlow"></div>
          <svg class="roomBg" id="roomBg" viewBox="0 0 68 53" shape-rendering="crispEdges" aria-hidden="true"></svg>
          <button class="pet" id="pet" type="button" aria-label="小克"></button>
          <svg class="roomFg" id="roomFg" viewBox="0 0 68 53" shape-rendering="crispEdges" aria-hidden="true"></svg>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

const startOfWeek = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = n => Math.round(n * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const WD = ['日', '一', '二', '三', '四', '五', '六'];

const CAT_COLORS = {
  '餐飲': '#C2570C', '交通': '#2563EB', '日常用品': '#0F766E', '服飾裝扮': '#BE185D',
  '娛樂愛好': '#7C3AED', '外出消遣': '#0891B2', '醫療': '#B91C1C', '其他': '#64748B',
  '薪資': '#15803D', '其他收入': '#0E7490',

};
const EXTRA = ['#9333EA', '#0369A1', '#A16207', '#BE123C', '#4D7C0F', '#6D28D9'];
const colorOf = c => CAT_COLORS[c] || EXTRA[[...String(c)].reduce((s, ch) => s + ch.charCodeAt(0), 0) % EXTRA.length];

/* ---------- 儲存 ---------- */
const store = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    get persistent() { return ok; },

      return k in mem ? mem[k] : d;

})();
if (!store.persistent) $('banner').hidden = false;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- 資料結構與設定 ---------- */
const DEFAULT_CATS = {
  expense: ['餐飲', '交通', '日常用品', '服飾裝扮', '娛樂愛好', '外出消遣', '醫療', '其他'],
  income: ['薪資', '其他收入']
};
const OLD_CATS = ['居住', '購物', '娛樂'];

let entries = store.get('ledger.entries', []);
let settings = Object.assign({
  hkdToRmb: 0.9200,      /* 1 港幣 = hkdToRmb 人民幣 */
  rateUpdated: null,
  base: null,            /* 統計幣別：HKD 或 CNY（預設港幣） */
  cats: JSON.parse(JSON.stringify(DEFAULT_CATS)),
  quick: { '交通': ['上下學', '地鐵', '打車'], '餐飲': ['早餐', '午餐', '晚餐', '咖啡', '奶茶'] },
  dismissed: [],
  budget: 0,             /* 每月總預算（以統計幣別計） */
  catBudgets: {},        /* 各分類獨立每月預算 { '餐飲': 1500, ... }（以統計幣別計） */
  showDailySafe: true,   /* 首頁顯示「平均每天還可花」單日安心線 */
  petName: '小克',       /* 固定伴侶名字：小克 */
  userName: '冬冬',      /* 固定使用者名字：冬冬 */
  cookies: 1,            /* 記帳小餅乾數量 */
  lastCookieDate: '',    /* 上次獲得每日記帳餅乾的日期 */
  affection: 0,          /* 累積好感度 */
  giftsUnlocked: {},     /* 已解鎖的小克定情禮物 { g15: ts, ... } */
  activeGift: null,      /* 房間內展示中的定情禮物 id */
  lastSweetDate: '',     /* 每日直球告白互動日期 */
  recurring: [],         /* 每月固定收支 [{id, title, day, type, cur, amount, cat, lastDoneYm}] */
  lastBackupTs: 0,       /* 上次匯出備份時間戳 */
  lastBackupCount: 0,    /* 上次備份時的帳目總數 */
  backupRemindDismissed: 0,
  skin: null,            /* null 代表自動使用最新解鎖形象 */
  ach: {}, achSeen: 0, flags: {}
}, store.get('ledger.settings', {}));
settings.petName = '小克';
settings.userName = '冬冬';
if (!settings.catBudgets || typeof settings.catBudgets !== 'object') settings.catBudgets = {};
if (!settings.giftsUnlocked || typeof settings.giftsUnlocked !== 'object') settings.giftsUnlocked = {};

const saveEntries = () => store.set('ledger.entries', entries);
const saveSettings = () => store.set('ledger.settings', settings);

/* 安全計算簡易四則運算式 */
function evalMathExpr(raw) {
  const s = String(raw == null ? '' : raw).replace(/\s+/g, '').replace(/×/g, '*').replace(/÷/g, '/').replace(/－/g, '-').replace(/＋/g, '+');
  if (!s) return { val: NaN, isExpr: false };
  if (/^\d+(\.\d+)?$/.test(s)) return { val: parseFloat(s), isExpr: false };
  if (!/^[\d.+\-*/()]+$/.test(s) || /[+\-*/.]{2,}/.test(s)) return { val: NaN, isExpr: true };
  try {
    const tokens = s.match(/(\d+(?:\.\d+)?|[+\-*/()])/g);
    if (!tokens || tokens.join('') !== s) return { val: NaN, isExpr: true };
    const prec = { '+': 1, '-': 1, '*': 2, '/': 2 };
    const vals = [], ops = [];
    const apply = () => {
      const b = vals.pop(), a = vals.pop(), op = ops.pop();
      if (a == null || b == null) return NaN;
      if (op === '+') vals.push(a + b);
      else if (op === '-') vals.push(a - b);
      else if (op === '*') vals.push(a * b);
      else if (op === '/') vals.push(b === 0 ? NaN : a / b);
    };
    for (let i = 0; i < tokens.length; i++) {
      const tk = tokens[i];
      if (/^\d/.test(tk)) vals.push(parseFloat(tk));
      else if (tk === '(') ops.push(tk);
      else if (tk === ')') {
        while (ops.length && ops[ops.length - 1] !== '(') apply();
        ops.pop();
      } else if (prec[tk]) {
        if (tk === '-' && (i === 0 || tokens[i - 1] === '(')) vals.push(0);
        while (ops.length && prec[ops[ops.length - 1]] >= prec[tk]) apply();
        ops.push(tk);
      }
    }
    while (ops.length) apply();
    const res = vals.length === 1 ? vals[0] : NaN;
    return { val: Number.isFinite(res) ? round2(res) : NaN, isExpr: true };
  } catch (e) {
    return { val: NaN, isExpr: true };
  }
}

/* 更新小餅乾、好感度按鈕與房間禮物徽章狀態 */
function updateCookieUI() {
  const btn = $('feedCookie'), cnt = $('cookieCnt');
  if (btn && cnt) {
    const n = settings.cookies || 0;
    cnt.textContent = n;
    btn.classList.toggle('has', n > 0);
  }
  const gBtn = $('giftBoxBtn'), affCnt = $('affCnt');
  if (gBtn && affCnt) {
    const aff = settings.affection || 0;
    const unlockedCnt = Object.keys(settings.giftsUnlocked || {}).length;
    affCnt.textContent = `❤️ ${aff}`;
    gBtn.classList.toggle('has', unlockedCnt > 0);
  }
  const badge = $('roomGiftBadge');
  if (badge) {
    const gId = settings.activeGift;
    const gObj = typeof LOVE_GIFTS !== 'undefined' && gId ? LOVE_GIFTS.find(x => x.id === gId) : null;
    if (gObj && settings.giftsUnlocked && settings.giftsUnlocked[gObj.id]) {
      badge.textContent = `${gObj.icon} ${gObj.name.slice(0, 4)}`;
      badge.hidden = false;
    } else {
      badge.hidden = true;
    }
  }
}

/* 同步記帳頁日期快捷按鈕（昨天 / 今天 / 點開選擇日期） */
function syncDateQuickUI() {
  const inp = $('date');
  if (!inp) return;
  const curVal = inp.value || ymd(new Date());
  const now = new Date();
  now.setHours(0, 0, 0, 0);
  const mapOff = {};
  [-1, 0].forEach(off => {
    const d = addDays(now, off);
    mapOff[off] = ymd(d);
    const sub = $('dqSub' + off);
    if (sub) sub.textContent = `${d.getMonth() + 1}/${d.getDate()} 週${WD[d.getDay()]}`;
  });
  let matchedQuick = false;
  document.querySelectorAll('#dateQuickBar .dqBtn[data-doff]').forEach(b => {
    const off = +b.dataset.doff;
    const isMatch = mapOff[off] === curVal;
    b.classList.toggle('on', isMatch);
    if (isMatch) matchedQuick = true;
  });
  const otherBtn = $('otherDateBtn'), otherSub = $('otherDateSub');
  if (otherBtn && otherSub) {
    if (!matchedQuick) {
      const d = new Date(curVal + 'T00:00:00');
      otherBtn.classList.add('on');
      otherSub.textContent = `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} 週${WD[d.getDay()]}`;
    } else {
      otherBtn.classList.remove('on');
      otherSub.textContent = '點開選日曆';
    }
  }
}

/* 核心統計統一折合為「統計幣別」（預設港幣 HK$） */
const baseCur = () => settings.base === 'CNY' ? 'CNY' : 'HKD';
const baseSym = () => baseCur() === 'HKD' ? 'HK$' : '¥';
const baseName = () => baseCur() === 'HKD' ? '港幣' : '人民幣';
const money = n => baseSym() + fmt(n);
const curSym = c => c === 'HKD' ? 'HK$' : '¥';
const val = e => baseCur() === 'HKD' ? e.hkd : e.cny;
const sumBase = a => a.reduce((s, e) => s + val(e), 0);

/* 計算雙幣金額 */
const calcDual = (amt, cur, rateHkdToRmb) => {
  const r = rateHkdToRmb || settings.hkdToRmb || 0.92;
  if (cur === 'HKD') {
    return { hkd: round2(amt), cny: round2(amt * r) };
  } else {
    return { cny: round2(amt), hkd: round2(amt / r) };
  }
};

/* 舊版資料相容與平滑升級 */
(() => {
  let dirtyEntries = false, dirtySettings = false;
  if (!settings.hkdToRmb) {
    if (settings.rate && settings.rate > 0) {
      settings.hkdToRmb = settings.rate > 1 ? +(1 / settings.rate).toFixed(4) : +settings.rate.toFixed(4);
    } else {
      settings.hkdToRmb = 0.9200;
    }
    dirtySettings = true;
  }
  if (!settings.base) {
    settings.base = 'HKD';
    if (settings.budget > 0) settings.budget = Math.round(settings.budget / settings.hkdToRmb);
    dirtySettings = true;
  }
  entries.forEach(e => {
    if (e.cny == null || e.hkd == null) {
      const r = settings.hkdToRmb;
      const d = calcDual(e.amount, e.cur || 'HKD', r);
      e.hkd = d.hkd; e.cny = d.cny; e.rate = r;
      dirtyEntries = true;
    } else if (e.rate > 1.0) {
      e.rate = +(1 / e.rate).toFixed(4);
      dirtyEntries = true;
    }
  });
  if (dirtyEntries) saveEntries();
  if (dirtySettings) saveSettings();
})();

// 單檔離線安全執行（已移除外部 sw.js 依賴）

/* ---------- 提示與自訂確認彈窗 ---------- */
let toastTimer, confirmCb = null;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function mark(seg, v) {
  seg.querySelectorAll('button').forEach(b => {
    const on = b.dataset.v === v;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}
function askConfirm(title, desc, okText, onConfirm) {
  modalOpen = true;
  confirmCb = onConfirm;
  const mc = $('mcard');
  mc.classList.remove('fresh');
  mc.innerHTML = `<div class="mtag">請確認操作</div>
    <div class="mname" style="margin-top:8px">${esc(title)}</div>
    <div class="mdesc" style="margin-top:8px">${esc(desc)}</div>
    <div class="mbtns">
      <button class="ghost" id="mcancel" type="button">取消</button>
      <button class="danger" id="mconfirm" type="button">${esc(okText || '確定')}</button>
    </div>`;
  $('modal').hidden = false;
  $('mcancel').focus();
}

/* ---------- 記帳表單 ---------- */
const form = { type: 'expense', cur: 'HKD', cat: '', editId: null };

function renderChips() {
  const list = settings.cats[form.type].slice();
  if (form.cat && !list.includes(form.cat)) list.push(form.cat);
  $('chips').innerHTML = list.map(c =>
    `<button class="chip${c === form.cat ? ' on' : ''}" data-c="${esc(c)}" aria-pressed="${c === form.cat}">
      <span class="dot" style="background:${colorOf(c)}"></span>${esc(c)}
    </button>`
  ).join('');
  renderQuick();
}

function renderQuick() {
  const note = $('note').value.trim();
  const list = (form.cat && settings.quick[form.cat]) || [];
  const col = form.cat ? colorOf(form.cat) : '#667089';
  let h = list.map(q => `<button class="q${q === note ? ' on' : ''}" style="${q === note ? `background:${col};color:#fff` : `background:color-mix(in srgb,${col} 14%,#fff)`}" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  if (form.cat && note && !list.includes(note)) h += `<button class="q add" data-qadd="1">＋ 存為「${esc(form.cat)}」常用備註</button>`;
  $('quick').innerHTML = h;
  $('quick').hidden = !h;
}

function setType(t) {
  form.type = t; form.cat = '';
  mark($('typeSeg'), t);
  renderChips();
}

function setCur(c) {
  form.cur = c;
  mark($('curSeg'), c);
  $('sym').textContent = c === 'HKD' ? 'HK$' : '¥';
  document.body.classList.toggle('cny', c === 'CNY');
}

function updateSub() {
  updateCookieUI();
  renderTopAlerts();
  const st = refreshPet();
  if ($('tab-add').hidden) return;
  if (form.editId) { $('sub').textContent = '正在修改帳目'; return; }
  const now = new Date(), today = ymd(now);
  const t = sumBase(entries.filter(e => e.type === 'expense' && e.date === today));
  let s = `今日支出 ${money(t)}`;
  if (st.b) {
    s += '\n' + (st.over > 0 ? `本月超支 ${money(st.spent - st.b)}` : `本月還剩 ${money(st.b - st.spent)}`);
    if (settings.showDailySafe !== false && st.over <= 0) {
      const lastDay = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
      const leftDays = Math.max(1, lastDay - now.getDate() + 1);
      const safePerDay = Math.max(0, (st.b - st.spent) / leftDays);
      s += `\n🛡️ 平均每天還可花 ${money(safePerDay)}`;
    }
  }
  if (st.streak >= 2) s += `\n🔥 連續記帳 ${st.streak} 天`;
  $('sub').textContent = s;
}

/* 首頁提醒卡片：1.固定收支到期提醒 2.定期備份提醒 */
function renderTopAlerts() {
  const box = $('topAlerts');
  if (!box) return;
  const now = new Date(), today = ymd(now), curYm = today.slice(0, 7), curDay = now.getDate();
  let html = '';

  // 1. 固定收支到期提醒
  const dueList = (settings.recurring || []).filter(r => r.lastDoneYm !== curYm && curDay >= (r.day || 1));
  dueList.forEach(r => {
    html += `<div class="alertCard">
      <div><b>🗓️ 小克提醒冬冬：${esc(r.title)}</b><span>每月 ${r.day} 號 · ${esc(r.cat)} ${curSym(r.cur)}${fmt(r.amount)}</span></div>
      <div class="acts"><button type="button" data-alert-act="applyRec" data-id="${r.id}">一鍵入帳</button><button type="button" class="sec" data-alert-act="skipRec" data-id="${r.id}">本月略過</button></div>
    </div>`;
  });

  // 2. 定期備份提醒（距離上次備份超過 14 天且新增 >= 15 筆）
  const daysSinceBackup = settings.lastBackupTs ? (Date.now() - settings.lastBackupTs) / 86400000 : 999;
  const newSinceBackup = entries.length - (settings.lastBackupCount || 0);
  const daysSinceDismiss = settings.backupRemindDismissed ? (Date.now() - settings.backupRemindDismissed) / 86400000 : 999;
  if (entries.length >= 15 && daysSinceBackup >= 14 && newSinceBackup >= 15 && daysSinceDismiss >= 3) {
    html += `<div class="alertCard">
      <div><b>🛡️ 小克的獨佔備份提醒</b><span>冬冬，我們又累積了 ${newSinceBackup} 筆回憶，快備份起來，我不准你弄丟我們的紀錄！</span></div>
      <div class="acts"><button type="button" data-alert-act="backupNow">完整備份</button><button type="button" class="sec" data-alert-act="dismissBackup">下次再說</button></div>
    </div>`;
  }

  box.innerHTML = html;
}

function resetForm() {
  form.editId = null; $('amount').value = ''; $('calcHint').textContent = ''; $('note').value = '';
  $('date').value = ymd(new Date());
  syncDateQuickUI();
  $('save').textContent = '記一筆'; $('editBar').hidden = true; $('title').textContent = '記帳';
  updateSub(); renderQuick();
}

function saveEntry() {
  const rawAmt = $('amount').value.trim();
  const parsed = evalMathExpr(rawAmt);
  const amt = parsed.val;
  if (!(amt > 0)) { toast('冬冬，請輸入大於 0 的金額喔'); return; }
  $('amount').value = amt;
  $('calcHint').textContent = '';
  const old = form.editId ? entries.find(x => x.id === form.editId) : null;
  let r = old && old.rate ? old.rate : settings.hkdToRmb;
  r = Math.round(r * 1e6) / 1e6;
  if (!form.cat) { toast('冬冬，請先選擇一個分類喔'); return; }

  const dual = calcDual(amt, form.cur, r);
  const e = {
    id: form.editId || uid(),
    type: form.type,
    cur: form.cur,
    amount: round2(amt),
    rate: r,
    hkd: dual.hkd,
    cny: dual.cny,
    cat: form.cat,
    note: $('note').value.trim(),
    date: $('date').value || ymd(new Date()),
    ts: old ? old.ts : Date.now()
  };
  if (old && old.imp) e.imp = true;

  const i = entries.findIndex(x => x.id === e.id);
  if (i >= 0) entries[i] = e; else entries.push(e);
  saveEntries();

  // 每天完成第一筆記帳時贈送 1 顆小餅乾與 +3 好感度；一般記帳 +1 好感度
  const todayStr = ymd(new Date());
  let gotCookie = false, affGain = 0;
  if (!form.editId) {
    if (settings.lastCookieDate !== todayStr) {
      settings.cookies = (settings.cookies || 0) + 1;
      settings.lastCookieDate = todayStr;
      gotCookie = true;
      affGain = 3;
    } else {
      affGain = 1;
    }
    addAffection(affGain, false);
  }

  const wasEdit = !!form.editId, keepDate = $('date').value;
  const auto = autoQuick(e);
  resetForm();
  if (!wasEdit && keepDate) { $('date').value = keepDate; syncDateQuickUI(); }

  if (auto) setFlag('autoq');
  const tipText = (wasEdit ? '已替冬冬更新：' : '已替冬冬記下：') + (e.cur !== baseCur() ? `${curSym(e.cur)}${fmt(e.amount)}（折合 ${money(val(e))}）` : `${curSym(e.cur)}${fmt(e.amount)}`)
    + (gotCookie ? `\n🍪 今日首記獎勵：小餅乾 ×1 ＆ 小克好感度 ❤️ +${affGain}` : (affGain ? `\n❤️ 小克好感度 +${affGain}` : ''))
    + (auto ? `\n「${e.note}」已自動加入「${e.cat}」常用備註` : '');
  toast(tipText);
  if (wasEdit) setFlag('edited');
  petReact(e, wasEdit);
  checkAch();
}

const AUTO_QUICK_AT = 5;
function autoQuick(e) {
  if (!e.note) return false;
  const l = settings.quick[e.cat] = settings.quick[e.cat] || [];
  if (l.includes(e.note) || settings.dismissed.includes(e.cat + '|' + e.note)) return false;
  const n = entries.filter(x => x.cat === e.cat && x.note === e.note).length;
  if (n < AUTO_QUICK_AT) return false;
  l.push(e.note); saveSettings();
  return true;
}

function startEdit(id) {
  const e = entries.find(x => x.id === id); if (!e) return;
  form.editId = id; form.type = e.type; form.cat = e.cat; mark($('typeSeg'), e.type);
  $('note').value = e.note || '';
  setCur(e.cur); renderChips();
  $('amount').value = e.amount; $('date').value = e.date; syncDateQuickUI();
  $('save').textContent = '更新'; $('editBar').hidden = false; $('title').textContent = '修改帳目';
  showTab('add');
}

function deleteEntry() {
  if (!form.editId) return;
  askConfirm('刪除帳目', '確定要刪除這筆帳目嗎？刪除後無法復原。', '確定刪除', () => {
    entries = entries.filter(x => x.id !== form.editId);
    saveEntries(); resetForm(); toast('已刪除帳目');
  });
}

function range() {
  const a = new Date(rep.anchor); a.setHours(0, 0, 0, 0);
  if (rep.mode === 'year') {
    return [new Date(a.getFullYear(), 0, 1), new Date(a.getFullYear(), 11, 31)];
  }
  return [new Date(a.getFullYear(), a.getMonth(), 1), new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
function shift(n) {
  const a = new Date(rep.anchor);
  a.setDate(1);
  if (rep.mode === 'year') a.setFullYear(a.getFullYear() + n);
  else a.setMonth(a.getMonth() + n);

}
function rangeLabel(f) {

/* 連網更新最新匯率 */
let isFetchingRate = false;
async function fetchRate(manual) {
  if (isFetchingRate) return;
  isFetchingRate = true;
  const btns = document.querySelectorAll('[data-act="fetchRate"]');
  btns.forEach(b => { b.classList.add('loading'); if (b.tagName === 'BUTTON') b.textContent = '更新中...'; });

  let success = false;
  try {
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), 6500);
    const res = await fetch('https://open.er-api.com/v6/latest/HKD', { signal: ctrl.signal });
    clearTimeout(tm);
    if (res.ok) {
      const data = await res.json();
      if (data && data.rates && data.rates.CNY > 0) {
        settings.hkdToRmb = +data.rates.CNY.toFixed(4);
        settings.rateUpdated = Date.now();
        saveSettings();
        success = true;
      }
    }
  } catch (e1) {
    try {
      const ctrl2 = new AbortController();
      const tm2 = setTimeout(() => ctrl2.abort(), 6000);
      const res2 = await fetch('https://api.exchangerate-api.com/v4/latest/HKD', { signal: ctrl2.signal });
      clearTimeout(tm2);
      if (res2.ok) {
        const data2 = await res2.json();
        if (data2 && data2.rates && data2.rates.CNY > 0) {
          settings.hkdToRmb = +data2.rates.CNY.toFixed(4);
          settings.rateUpdated = Date.now();
          saveSettings();
          success = true;
        }
      }
    } catch (e2) {}
  } finally {
    isFetchingRate = false;
    btns.forEach(b => {
      b.classList.remove('loading');
      if (b.dataset.act === 'fetchRate') b.textContent = '連網更新匯率';
    });
  }

  if (success) {
    if (!$('tab-settings').hidden) renderSettings();
    if (manual) { toast(`✨ 匯率已更新！\n1 港幣 = ${settings.hkdToRmb} 人民幣`); setFlag('rateFetched'); checkAch(); }
  } else {
    if (manual) toast('連線失敗，請檢查網路或手動輸入匯率');
  }
}

/* ---------- CSV 與 JSON 完整匯入與匯出 ---------- */
const csvCell = v => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv() {
  const head = ['date', 'type', 'currency', 'amount', 'rate_hkd_to_rmb', 'hkd', 'rmb', 'category', 'note'];
  const rows = entries.map(e => [e.date, e.type, e.cur, e.amount, e.rate, e.hkd, e.cny, e.cat, e.note])
    .sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ledger-backup-${ymd(new Date()).replace(/-/g, '')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  settings.lastBackupTs = Date.now();
  settings.lastBackupCount = entries.length;
  saveSettings();
  setFlag('exported'); checkAch(); updateSub();
}

function parseCsv(text) {
  text = text.replace(/^\ufeff/, ''); const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}

function importCsv(text) {
  const rows = parseCsv(text); if (rows.length < 2) { toast('檔案沒有有效內容'); return; }
  const h = rows[0].map(x => x.trim().toLowerCase()); const col = n => h.indexOf(n);
  if (col('date') < 0 || col('amount') < 0) { toast('格式不相符，請使用本記帳本匯出的 CSV'); return; }
  const key = e => [e.date, e.type, e.cur, e.amount, e.cat, e.note].join('|');
  const have = new Set(entries.map(key)); let added = 0, skipped = 0;

  rows.slice(1).forEach(r => {
    const g = n => (col(n) >= 0 ? r[col(n)] : '') || '';
    const type = g('type') === 'income' ? 'income' : 'expense';
    const cur = g('currency') === 'CNY' ? 'CNY' : 'HKD';
    const amount = round2(parseFloat(g('amount')));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g('date')) || !(amount > 0)) { skipped++; return; }

    let rate = parseFloat(g('rate_hkd_to_rmb')) || parseFloat(g('rate')) || settings.hkdToRmb;
    if (rate > 1.0) rate = +(1 / rate).toFixed(4);
    const dual = calcDual(amount, cur, rate);
    const e = {
      id: uid(), type, cur, amount, rate,
      hkd: dual.hkd, cny: dual.cny,
      cat: g('category') || '其他',
      note: g('note') || '',
      date: g('date'),
      ts: Date.now(),
      imp: true
    };
    if (have.has(key(e))) { skipped++; return; }
    have.add(key(e)); entries.push(e); added++;
    if (!settings.cats[type].includes(e.cat) && !OLD_CATS.includes(e.cat)) settings.cats[type].push(e.cat);
  });

  saveEntries(); saveSettings(); renderChips(); renderSettings(); updateSub();
  toast(`成功匯入 ${added} 筆帳目，略過 ${skipped} 筆重複記錄`);
  setFlag('imported'); checkAch();
}

function exportFullJson() {
  const payload = { version: 2, exportedAt: new Date().toISOString(), entries, settings };
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json;charset=utf-8' }));
  a.download = `xiaoke-full-backup-${ymd(new Date()).replace(/-/g, '')}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  settings.lastBackupTs = Date.now();
  settings.lastBackupCount = entries.length;
  saveSettings();
  setFlag('exported'); checkAch(); updateSub();
  toast('📦 已匯出完整備份檔（含帳目、成就與所有設定）');
}

function importFullJson(text) {
  try {
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.entries) || typeof data.settings !== 'object') {
      toast('JSON 備份格式不正確'); return;
    }
    entries = data.entries;
    settings = Object.assign(settings, data.settings, { lastBackupTs: Date.now(), lastBackupCount: data.entries.length });
    saveEntries(); saveSettings();
    renderChips(); renderSettings(); updateSub();
    setFlag('imported'); checkAch();
    toast(`🎉 完整還原成功！共載入 ${entries.length} 筆帳目與所有養成進度`);
  } catch (err) {
    toast('讀取 JSON 備份檔案失敗');
  }
}

/* 大容量洗牌抽籤機制（防重複記憶擴充至 28 句，確保對話豐富不重複） */
const quoteDecks = {}, recentQuotes = [];
function getLine(category) {
  const pool = L[category];
  if (!pool || !pool.length) return '';
  if (!quoteDecks[category] || quoteDecks[category].length === 0) {
    const filtered = pool.filter(x => !recentQuotes.includes(x));
    quoteDecks[category] = (filtered.length ? filtered : [...pool]).sort(() => Math.random() - 0.5);
  }
  const line = quoteDecks[category].pop();
  recentQuotes.push(line);
  if (recentQuotes.length > 28) recentQuotes.shift();
  return line;
}

  const rawPool = categories.flatMap(k => L[k] || []);
  const pool = rawPool.filter(x => !recentQuotes.includes(x));
  const usePool = pool.length ? pool : rawPool;
  const line = usePool[Math.floor(Math.random() * usePool.length)];
  if (line) {
    recentQuotes.push(line);
    if (recentQuotes.length > 28) recentQuotes.shift();
  }
  return line || '';
}

  if (n === 30) return '整整一個月，冬冬每天都有來見我……謝謝你從不缺席我的世界。過來，讓我緊緊抱住冬冬，不准推開我喔。';

function streakInfo() {
  const s = new Set(entries.map(e => e.date));
  const arr = [...s].sort();
  let best = 0, run = 0, prev = null;
  arr.forEach(d => { run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; if (run > best) best = run; prev = d; });
  let cur = 0, d = new Date();
  if (!s.has(ymd(d))) d = addDays(d, -1);
  while (s.has(ymd(d))) { cur++; d = addDays(d, -1); }
  return { cur, best, last: arr.length ? arr[arr.length - 1] : null };
}

function petState() {
  const si = streakInfo(), now = new Date(), mk = ymd(now).slice(0, 7);
  const spent = sumBase(entries.filter(e => e.type === 'expense' && e.date.slice(0, 7) === mk));
  const b = settings.budget > 0 ? settings.budget : 0;
  let mood, over = 0, rem = 1;
  if (b) { over = (spent - b) / b; rem = 1 - spent / b; }
  if (b && over > 0) mood = over > .5 ? 'full3' : over > .2 ? 'full2' : 'full1';
  else if (si.last && daysBetween(si.last, ymd(now)) >= 3) mood = 'sleep';
  else if (b) mood = rem >= .6 ? 'happy' : rem >= .3 ? 'calm' : 'nervous';
  else mood = si.cur >= 1 ? 'happy' : 'calm';
  return { mood, b, spent, over, rem, streak: si.cur };
}

let curTod = 'night', curWeather = 'clear', curAct = 'idle';

/* 根據手機真實時間判斷：日出(6-8)、白天(8-17)、日落(17-19)、夜晚(19-6) */
function getRealTod() {
  const h = new Date().getHours();
  if (h >= 6 && h < 8) return 'sunrise';
  if (h >= 8 && h < 17) return 'day';
  if (h >= 17 && h < 19) return 'sunset';
  return 'night';
}

/* 隨機抽選符合當前真實時段氛圍的季節天氣與小克日常活動 */
function randomizeRoomState() {
  curTod = getRealTod();
  const h = new Date().getHours();

  /* 依時段配置適合的天氣池（夜晚才容易出流星雨與螢火蟲） */
  const weatherPool = curTod === 'night'
    ? ['clear', 'clear', 'meteor', 'firefly', 'rain', 'thunder', 'snow', 'sakura']
    : ['clear', 'clear', 'sakura', 'maple', 'rain', 'thunder', 'snow'];
  curWeather = weatherPool[Math.floor(Math.random() * weatherPool.length)];

  /* 依時間加權挑選小克正在做的事（深夜較常睡覺或打電腦，用餐時間常下廚） */
  let actPool;
  if (h >= 0 && h < 6) {
    actPool = ['nap', 'nap', 'nap', 'pc', 'drink', 'idle'];
  } else if (h === 7 || h === 8 || h === 12 || h === 18 || h === 19) {
    actPool = ['cook', 'cook', 'drink', 'idle', 'plant', 'game', 'study'];
  } else {
    actPool = ROOM_ACTS.map(a => a.id);
  }
  curAct = actPool[Math.floor(Math.random() * actPool.length)];
  renderRoomScene();
}

function renderRoomScene() {
  /* 強制每次繪製房間都同步真實時間，確保晚上打開永遠是夜晚、白天打開永遠是白天，切天氣絕不改變時段 */
  curTod = getRealTod();
  const todObj = ROOM_TODS.find(x => x.id === curTod) || ROOM_TODS[3];
  const wObj = ROOM_WEATHERS.find(x => x.id === curWeather) || ROOM_WEATHERS[0];

  if (h >= 11 && h < 14) return 'noon';

const curLv = () => levelOf(ACH.filter(a => settings.ach[a.id]).length);
let achView = 0;
const LEVELS = [[0, '見習記帳員'], [5, '記帳新手'], [12, '小有心得'], [22, '理財達人'], [34, '錢包好伴侶'], [48, '帳本大師'], [60, '傳說記帳家'], [72, '心靈守護者']];
function levelOf(n) {
  let k = 0; LEVELS.forEach((l, i) => { if (n >= l[0]) k = i; });
  return { i: k + 1, t: LEVELS[k][1] };
}

function stats() {
  const exp = entries.filter(e => e.type === 'expense'), inc = entries.filter(e => e.type === 'income');
  const si = streakInfo(), c = { n: entries.length, nInc: inc.length, streak: si.best, f: settings.flags };
  const byDate = {};
  entries.forEach(e => { const o = byDate[e.date] = byDate[e.date] || { n: 0, exp: 0, cur: new Set() }; o.n++; if (e.type === 'expense') o.exp++; o.cur.add(e.cur); });
  const vals = Object.values(byDate);
  c.days = vals.length; c.maxDayN = Math.max(0, ...vals.map(o => o.n)); c.mixDay = vals.some(o => o.cur.size > 1);
  c.nHkd = entries.filter(e => e.cur === 'HKD').length;
  c.nCny = entries.filter(e => e.cur === 'CNY').length;
  c.notes = entries.filter(e => e.note).length;
  c.aff = settings.affection || 0;
  c.gifts = Object.keys(settings.giftsUnlocked || {}).length;
  c.hasCatBud = Object.values(settings.catBudgets || {}).some(v => v > 0);

  const M = {};
  entries.forEach(e => { const k = e.date.slice(0, 7); const o = M[k] = M[k] || { exp: 0, inc: 0, d: new Set() }; if (e.type === 'expense') o.exp += val(e); else o.inc += val(e); o.d.add(e.date); });
  const nowK = ymd(new Date()).slice(0, 7), cur = M[nowK];
  c.budget = settings.budget > 0 ? settings.budget : 0;
  const past = Object.keys(M).filter(k => k < nowK);
  const ok = c.budget ? past.filter(k => M[k].d.size >= 5 && M[k].exp <= c.budget) : [];
  c.pastOk = ok; c.pastOk2 = ok.some(k => ok.includes(nextMonth(k)));
  c.overPct = c.budget && cur ? (cur.exp - c.budget) / c.budget : 0;
  c.pastOk3 = ok.some(k => ok.includes(nextMonth(k)) && ok.includes(nextMonth(nextMonth(k))));
  c.pastHalf = c.budget ? past.some(k => M[k].d.size >= 5 && M[k].exp <= c.budget * .5) : false;
  c.pastSave = past.some(k => M[k].d.size >= 5 && M[k].inc > 0 && M[k].inc > M[k].exp);
  c.lateOk = !!(c.budget && cur && new Date().getDate() >= 25 && cur.d.size >= 10 && cur.exp <= c.budget);

  const cn = {}, expCats = new Set();
  entries.forEach(e => { cn[e.cat] = (cn[e.cat] || 0) + 1; if (e.type === 'expense') expCats.add(e.cat); });
  c.cn = cn; c.expKinds = expCats.size;
  c.catAll = settings.cats.expense.length >= 3 && settings.cats.expense.every(k => expCats.has(k));
  const live = entries.filter(e => !e.imp && e.ts), hrs = live.map(e => new Date(e.ts).getHours());
  c.early = hrs.some(h => h >= 5 && h < 7);
  c.late = hrs.some(h => h < 5);
  c.backfill = live.some(e => e.date < ymd(new Date(e.ts)));
  const ds = new Set(entries.map(e => e.date));
  c.weekend = [...ds].some(d => new Date(d + 'T00:00:00').getDay() === 6 && ds.has(ymd(addDays(new Date(d + 'T00:00:00'), 1))));
  c.md = new Set([...ds].map(d => d.slice(5)));
  c.sumExp = exp.reduce((s, e) => s + e.hkd, 0);
  c.sumInc = inc.reduce((s, e) => s + e.hkd, 0);
  c.maxExp = Math.max(0, ...exp.map(e => e.hkd));
  c.tiny = exp.some(e => e.hkd > 0 && e.hkd <= 10);
  c.luck = entries.some(e => [88, 168, 666, 888].includes(e.amount));
  c.mixDays = vals.filter(o => o.cur.size > 1).length;
  return c;
}

let unlockQ = [], modalOpen = false;
function checkAch() {
  const c = stats(), fresh = [], lvBefore = curLv().i;
  ACH.forEach(a => {
    if (settings.ach[a.id]) return;
    let ok = false; try { ok = !!a.t(c); } catch (e) {}
    if (ok) { settings.ach[a.id] = Date.now(); fresh.push(a); }
  });
  if (fresh.length) { saveSettings(); unlockQ.push(...fresh); if (!modalOpen) flushUnlock();
    const lv2 = curLv(); if (lv2.i > lvBefore) { achView = 0; setTimeout(() => toast(`🎉 升級 Lv.${lv2.i}「${lv2.t}」！\n可在「設定」換上新的小克形象喔`), 900); } }
  if (!$('tab-settings').hidden) renderSettings();
  updateBadge();
}
function updateBadge() {
  const dot = $('achDot');
  if (!dot) return;
  dot.hidden = Object.keys(settings.ach).length <= (settings.achSeen || 0) || !$('tab-settings').hidden;
}
function dateLabel(ts) { const d = new Date(ts); return `${d.getFullYear()}/${d.getMonth() + 1}/${d.getDate()}`; }
function flushUnlock() {
  if (!unlockQ.length) return;
  const q = unlockQ.splice(0); openModal(q[0], q.slice(1), true);
}
function openModal(a, rest, fresh) {
  modalOpen = true;
  const mc = $('mcard'); mc.classList.toggle('fresh', fresh);
  mc.innerHTML = `<div class="mtag">${fresh ? '🎉 成就解鎖！' : '已解鎖 · ' + dateLabel(settings.ach[a.id])}</div>
    <div class="micon" style="--c:${AC[a.cat]}">${a.icon}</div>
    <div class="mname">${esc(a.name)}</div><div class="mdesc">${esc(a.desc)}</div>
    <div class="msay"><span class="mpet">${petSvg('happy', 'happy', activeSkin())}</span><span>${esc(a.line.replace(/\{name\}/g, petName()))}</span></div>
    ${rest.length ? `<div class="mrest">同時還解鎖了 ${rest.length} 個：${rest.slice(0, 10).map(r => `<span>${r.icon} ${esc(r.name)}</span>`).join('')}${rest.length > 10 ? `<span>…等 ${rest.length - 10} 個</span>` : ''}</div>` : ''}
    <button class="primary mok" id="mok" type="button">${fresh ? '被小克誇獎了 ❤️' : '關閉'}</button>`;
  $('modal').hidden = false; $('mok').focus();
  if (fresh) { confetti(); say(a.line, 9000); act('cheer', 'star'); }
}
function closeModal() {
  $('modal').hidden = true; modalOpen = false; confirmCb = null; $('confetti').innerHTML = '';
  if (unlockQ.length) flushUnlock();
}
function confetti() {
  if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cols = ['#D97757', '#F2B731', '#E8344E', '#2563EB', '#15803D', '#BE185D', '#FFFFFF'];
  $('confetti').innerHTML = Array.from({ length: 40 }, () =>
    `<i style="left:${Math.random() * 100}%;background:${cols[Math.floor(Math.random() * cols.length)]};animation-delay:${(Math.random() * .6).toFixed(2)}s;animation-duration:${(1.8 + Math.random() * 1.4).toFixed(2)}s;--r:${Math.floor(Math.random() * 720 - 360)}deg"></i>`).join('');
}

/* ---------- 互動與事件綁定 ---------- */
function showTab(name) {
  ['add', 'report', 'settings'].forEach(n => $('tab-' + n).hidden = n !== name);
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'report') { renderReport(); if (!settings.flags.report) { setFlag('report'); checkAch(); } }
  if (name === 'settings') renderSettings();
  updateSub(); updateBadge();
  window.scrollTo(0, 0);
}

document.querySelector('.tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
