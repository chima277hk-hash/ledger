/* 金額欄即時算式提示與符號快捷鍵 */
function updateCalcPreview() {
  const raw = $('amount').value.trim();
  const res = evalMathExpr(raw);
  if (res.isExpr && Number.isFinite(res.val)) {
    $('calcHint').textContent = `＝ ${curSym(form.cur)}${fmt(res.val)}`;
  } else {
    $('calcHint').textContent = '';
  }
}
$('amount').addEventListener('input', () => {
  if (petMood !== 'sleep') look('d', 1600);
  updateCalcPreview();
});
$('amount').addEventListener('blur', () => {
  const res = evalMathExpr($('amount').value.trim());
  if (res.isExpr && Number.isFinite(res.val) && res.val > 0) {
    $('amount').value = res.val;
    $('calcHint').textContent = '';
  }
});
$('calcOps').addEventListener('click', e => {
  const b = e.target.closest('button[data-op]');
  if (!b) return;
  const op = b.dataset.op, inp = $('amount');
  if (op === '=') {
    const res = evalMathExpr(inp.value.trim());
    if (Number.isFinite(res.val) && res.val > 0) {
      inp.value = res.val;
      $('calcHint').textContent = '';
    } else toast('冬冬，算式還沒寫完喔');
  } else {
    inp.value = (inp.value || '') + op;
    inp.focus();
    updateCalcPreview();
  }
});

/* 首頁提醒卡點擊處理（固定收支一鍵入帳、完整備份） */
$('topAlerts').addEventListener('click', e => {
  const b = e.target.closest('button[data-alert-act]');
  if (!b) return;
  const actName = b.dataset.alertAct;
  const curYm = ymd(new Date()).slice(0, 7);
  if (actName === 'applyRec') {
    const r = (settings.recurring || []).find(x => x.id === b.dataset.id);
    if (!r) return;
    const rate = settings.hkdToRmb || 0.92;
    const dual = calcDual(r.amount, r.cur, rate);
    const entry = {
      id: uid(), type: r.type || 'expense', cur: r.cur || 'HKD',
      amount: round2(r.amount), rate, hkd: dual.hkd, cny: dual.cny,
      cat: r.cat, note: r.title, date: ymd(new Date()), ts: Date.now()
    };
    entries.push(entry); r.lastDoneYm = curYm;
    saveEntries(); saveSettings();
    addAffection(1, false);
    updateSub();
    toast(`✅ 已替冬冬一鍵入帳：${r.title} ${curSym(r.cur)}${fmt(r.amount)}`);
    petReact(entry, false); checkAch();
  } else if (actName === 'skipRec') {
    const r = (settings.recurring || []).find(x => x.id === b.dataset.id);
    if (r) { r.lastDoneYm = curYm; saveSettings(); renderTopAlerts(); toast('已略過本月提醒'); }
  } else if (actName === 'backupNow') {
    exportFullJson();
  } else if (actName === 'dismissBackup') {
    settings.backupRemindDismissed = Date.now(); saveSettings(); renderTopAlerts();
  }
});

/* 切換小房間天氣、日常活動、餵食小餅乾與打開禮物盒 */
$('weatherBtn').addEventListener('click', cycleWeatherScene);
$('actBtn').addEventListener('click', cycleActScene);
$('giftBoxBtn').addEventListener('click', openGiftBoxModal);

$('feedCookie').addEventListener('click', () => {
  if ((settings.cookies || 0) <= 0) {
    toast('冬冬，目前沒有小餅乾喔～每天記下第一筆帳就能獲得 1 顆🍪！');
    return;
  }
  settings.cookies--;
  const unlocked = addAffection(5, false);
  act('cheer', 'love'); chew();
  say(getLine('cookie'), 8000);
  if (!unlocked) toast(`🍪 謝謝冬冬投餵！小克好感度 +5（目前 ❤️ ${settings.affection}）`);
});

$('note').addEventListener('input', renderQuick);

$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { form.cat = b.dataset.c; renderChips(); } });
$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.qadd) {
    const note = $('note').value.trim();
    if (!form.cat || !note) return;
    (settings.quick[form.cat] = settings.quick[form.cat] || []).push(note);
    settings.dismissed = settings.dismissed.filter(k => k !== form.cat + '|' + note); saveSettings();
    setFlag('addq'); toast(`已替冬冬加入「${form.cat}」常用備註`); checkAch();
  } else if (b.dataset.q) {
    $('note').value = $('note').value.trim() === b.dataset.q ? '' : b.dataset.q;
  }
  renderQuick();
});

$('save').addEventListener('click', saveEntry);
$('del').addEventListener('click', deleteEntry);
$('cancel').addEventListener('click', resetForm);

/* 支援「長按摸摸頭」與「點擊說話」 */
let tapTimes = [], holdTimer = null, didHoldPat = false;
$('pet').addEventListener('pointerdown', () => {
  didHoldPat = false;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(() => {
    didHoldPat = true;
    const unlocked = addAffection(2, false);
    act('jiggle'); setFace('love', 2600);
    say(getLine('headpat'), 7500);
    if (!unlocked) toast(`🤚 被冬冬摸摸頭了～小克好感度 +2（❤️ ${settings.affection}）`);
  }, 520);
});
['pointerup', 'pointerleave', 'pointercancel'].forEach(evName => {
  $('pet').addEventListener(evName, () => clearTimeout(holdTimer));
});

$('pet').addEventListener('click', () => {
  if (didHoldPat) { didHoldPat = false; return; }
  const f = settings.flags; f.taps = (f.taps || 0) + 1; saveSettings();
  const now = Date.now(); tapTimes = tapTimes.filter(t => now - t < 2200); tapTimes.push(now);
  const st = petState(), fat = st.mood.indexOf('full') === 0;

  if (tapTimes.length >= 6) {
    act('dizzy'); tapTimes = [];
    if (!f.dizzy) { setFlag('dizzy'); setTimeout(checkAch, 900); }
    say(getLine('dizzy'));
  } else if (st.mood === 'sleep') {
    act('jump'); setFace('wow', 800);
    say(getLine('tapSleep'));
  } else if (fat) {
    act('jiggle'); setFace('grin', 1300);
    say(getLine('tapFat'));
  } else {
    const r = Math.random();
    if (r < .3) { act('jump'); setFace('love', 2200); }
    else if (r < .55) act('wave');
    else if (r < .75) { act('jump'); setFace('wink', 1200); }
    else if (r < .9) { act('jiggle'); setFace('grin', 1300); }
    else act('cheer');
    say(getLine('tap'));
  }
  if ([10, 75, 120, 200].includes(f.taps)) checkAch();
});

document.addEventListener('pointerdown', ev => {
  if ($('tab-add').hidden || petMood === 'sleep' || modalOpen) return;
  const r = $('pet').getBoundingClientRect(), dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
  if (Math.abs(dx) < 40 && Math.abs(dy) < 60) return;
  look(Math.abs(dy) > 120 ? 'd' : dx < 0 ? 'l' : 'r', 1100);
});

$('modal').addEventListener('click', e => {
  const p = e.target.closest('[data-preview-skin]');
  if (p) {
    const moves = ['a-jump','a-dance','a-wave','a-turn','a-cheer'], cls = moves[Math.floor(Math.random() * moves.length)];
    moves.forEach(x => p.classList.remove(x)); void p.offsetWidth; p.classList.add(cls);
    setTimeout(() => p.classList.remove(cls), 2700); return;
  }
  const gv = e.target.closest('[data-gift-view]');
  if (gv) {
    const g = LOVE_GIFTS.find(x => x.id === gv.dataset.giftView);
    if (g && settings.giftsUnlocked && settings.giftsUnlocked[g.id]) {
      settings.activeGift = g.id;
      saveSettings();
      updateCookieUI();
      openGiftUnlockModal(g, false);
    }
    return;
  }
  const ds = e.target.closest('[data-daily-sweet]');
  if (ds) {
    const todayStr = ymd(new Date());
    if (settings.lastSweetDate !== todayStr) {
      settings.lastSweetDate = todayStr;
      const unlocked = addAffection(3, true);
      act('cheer', 'love');
      say(getLine('tap'), 8500);
      if (!unlocked) {
        openGiftBoxModal();
        toast(`💘 小克向冬冬直球告白！好感度 ❤️ +3（目前 ${settings.affection}）`);
      }
    } else {
      closeModal();
      act('jump', 'love');
      say(getLine('tap'), 8500);
    }
    return;
  }
  if (e.target.id === 'mbackGifts') {
    openGiftBoxModal();
    return;
  }
  if (e.target.id === 'mconfirm') {
    const fn = confirmCb;
    closeModal();
    if (fn) fn();
    return;
  }
  if (e.target.id === 'modal' || e.target.id === 'mok' || e.target.id === 'mcancel') closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen) closeModal(); });

$('tab-report').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.rmode) {
    rep.mode = b.dataset.rmode;
    rep.dayFilter = '';
    renderReport();
  } else if (b.dataset.nav) {
    if (b.dataset.nav === 'today') rep.anchor = new Date();
    else shift(+b.dataset.nav);
    rep.dayFilter = '';
    renderReport();
  } else if (b.dataset.d) {
    rep.dayFilter = rep.dayFilter === b.dataset.d ? '' : b.dataset.d;
    renderReport();
  } else if (b.dataset.ym) {
    const [y, m] = b.dataset.ym.split('-').map(Number);
    rep.mode = 'month';
    rep.anchor = new Date(y, m - 1, 1);
    rep.dayFilter = '';
    renderReport();
    window.scrollTo(0, 0);
  } else if (b.dataset.fcat !== undefined) {
    rep.cat = b.dataset.fcat;
    renderReport();
  } else if (b.dataset.clearFilter) {
    rep.q = ''; rep.cat = ''; rep.dayFilter = '';
    renderReport();
  } else if (b.dataset.id) {
    startEdit(b.dataset.id);
  }
});
$('tab-report').addEventListener('change', e => {
  if (e.target.id === 'repMonthPick' && e.target.value) {
    const [y, m] = e.target.value.split('-').map(Number);
    if (y && m) {
      rep.mode = 'month';
      rep.anchor = new Date(y, m - 1, 1);
      rep.dayFilter = '';
      renderReport();
    }
  }
});
$('tab-report').addEventListener('input', e => {
  if (e.target.id === 'repSearch') {
    rep.q = e.target.value;
    const pos = e.target.selectionStart;
    renderReport();
    const inp = $('repSearch');
    if (inp) { inp.focus(); try { inp.setSelectionRange(pos, pos); } catch (err) {} }
  }
});

$('tab-settings').addEventListener('change', e => {
  if (e.target.id === 'setBudget') {
    const v = parseFloat(e.target.value); settings.budget = v > 0 ? round2(v) : 0; saveSettings(); updateSub(); renderSettings();
    toast(settings.budget ? `已儲存每月總預算 ${money(settings.budget)}` : '已取消每月總預算'); checkAch();
  } else if (e.target.dataset && e.target.dataset.catBud) {
    const cat = e.target.dataset.catBud;
    const v = parseFloat(e.target.value);
    if (!settings.catBudgets) settings.catBudgets = {};
    if (v > 0) settings.catBudgets[cat] = round2(v);
    else delete settings.catBudgets[cat];
    saveSettings(); renderSettings();
    toast(v > 0 ? `已設定「${cat}」月預算 ${money(round2(v))}` : `已清除「${cat}」月預算`);
    checkAch();
  } else if (e.target.id === 'setDailySafe') {
    settings.showDailySafe = !!e.target.checked; saveSettings(); updateSub();
    toast(settings.showDailySafe ? '已開啟單日安心線提示' : '已隱藏單日安心線提示');
  } else if (e.target.id === 'setRate') {
    const v = parseFloat(e.target.value);
    if (v > 0) {
      settings.hkdToRmb = Math.round(v * 1e4) / 1e4; saveSettings();
      setFlag('rateEdit'); toast('匯率已儲存'); checkAch();
    } else e.target.value = settings.hkdToRmb;
  }
});

$('tab-settings').addEventListener('click', e => {
  const sk = e.target.closest('[data-skin]');
  if (sk) {
    const k = +sk.dataset.skin, lv = curLv();
    if (k <= lv.i) {
      settings.skin = k; achView = 0; saveSettings(); refreshPet(); renderSettings();
      toast(`小克已為冬冬換上「${LEVELS[k - 1][1]}」形象`);
    } else {
      toast(`冬冬再解鎖到 ${LEVELS[k - 1][0]} 個成就，小克就能穿這套給你看囉`);
    }
    return;
  }
  if (e.target.closest('#achPet')) {
    const el = $('achPet'); el.classList.remove('a-jump'); void el.offsetWidth; el.classList.add('a-jump');
    toast(`小克：${getLine('tap')}`);
    return;
  }
  if (e.target.closest('#nextPet')) {
    toast(`下一級小克將變成「${LEVELS[curLv().i][1]}」的新形象`);
    return;
  }
  const ac = e.target.closest('.acard');
  if (ac) {
    const a = ACH.find(x => x.id === ac.dataset.a);
    if (a && settings.ach[a.id]) openModal(a, [], false);
    else toast(getLine('lockedTap'));
    return;
  }

  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, t = b.dataset.t;
  if (act === 'fetchRate') fetchRate(true);
  else if (act === 'openGifts') openGiftBoxModal();
  else if (act === 'toggleAchList') { achExpanded = !achExpanded; renderSettings(); }
  else if (act === 'syncCatSum') {
    const cBuds = settings.catBudgets || {};
    const sum = round2(settings.cats.expense.reduce((s, c) => s + (parseFloat(cBuds[c]) > 0 ? parseFloat(cBuds[c]) : 0), 0));
    if (sum > 0) {
      settings.budget = sum;
      saveSettings(); updateSub(); renderSettings();
      toast(`已將每月總預算同步為分類預算加總 ${money(sum)}`);
      checkAch();
    }
  }
  else if (act === 'gallery') openGallery();
  else if (act === 'export') { if (!entries.length) toast('目前還沒有記錄可匯出'); else exportCsv(); }
  else if (act === 'import') $('file').click();
  else if (act === 'exportJson') exportFullJson();
  else if (act === 'importJson') $('jsonFile').click();
  else if (act === 'addrec') {
    const title = $('recTitle').value.trim();
    const day = Math.min(31, Math.max(1, parseInt($('recDay').value, 10) || 1));
    const cur = $('recCur').value;
    const amount = round2(parseFloat($('recAmt').value));
    const cat = $('recCat').value;
    if (!title || !(amount > 0)) { toast('請填寫固定收支名稱與大於 0 的金額'); return; }
    const type = settings.cats.income.includes(cat) ? 'income' : 'expense';
    settings.recurring = settings.recurring || [];
    settings.recurring.push({ id: uid(), title, day, type, cur, amount, cat, lastDoneYm: '' });
    saveSettings(); renderSettings(); updateSub();
    toast(`已新增每月 ${day} 號固定項目「${title}」`);
  } else if (act === 'delrec') {
    settings.recurring = (settings.recurring || []).filter(r => r.id !== b.dataset.id);
    saveSettings(); renderSettings(); updateSub();
    toast('已刪除固定收支項目');
  } else if (act === 'qsel') { qSel = b.dataset.c; renderSettings(); }
  else if (act === 'qadd') {
    const v = $('newq').value.trim(); if (!v) return;
    const l = settings.quick[qSel] = settings.quick[qSel] || [];
    if (l.includes(v)) { toast('已經有這個常用備註囉'); return; }
    l.push(v); setFlag('addq'); settings.dismissed = settings.dismissed.filter(k => k !== qSel + '|' + v); saveSettings(); renderSettings(); renderQuick(); checkAch();
  } else if (act === 'qdel') {
    settings.quick[qSel] = (settings.quick[qSel] || []).filter(q => q !== b.dataset.q);
    settings.dismissed.push(qSel + '|' + b.dataset.q); saveSettings(); renderSettings(); renderQuick();
  } else if (act === 'addcat') {
    const v = $('newcat-' + t).value.trim(); if (!v) return;
    if (settings.cats[t].includes(v)) { toast('該分類已存在'); return; }
    settings.cats[t].push(v); setFlag('addcat'); saveSettings(); renderSettings(); renderChips(); checkAch();
  } else if (act === 'delcat') {
    if (settings.cats[t].length <= 1) { toast('至少要保留一個分類喔'); return; }
    const delName = b.dataset.c;
    settings.cats[t] = settings.cats[t].filter(c => c !== delName);
    if (settings.catBudgets && settings.catBudgets[delName]) delete settings.catBudgets[delName];
    saveSettings(); renderSettings(); renderChips();
  } else if (act === 'setbase') {
    const v = b.dataset.v;
    if (v !== baseCur()) {
      const r = settings.hkdToRmb || 0.92;
      if (settings.budget > 0) settings.budget = Math.round(v === 'CNY' ? settings.budget * r : settings.budget / r);
      if (settings.catBudgets && typeof settings.catBudgets === 'object') {
        Object.keys(settings.catBudgets).forEach(k => {
          if (settings.catBudgets[k] > 0) {
            settings.catBudgets[k] = Math.round(v === 'CNY' ? settings.catBudgets[k] * r : settings.catBudgets[k] / r);
          }
        });
      }
      settings.base = v; saveSettings(); setFlag('baseSwitch');
      renderSettings(); updateSub(); toast(`統計幣別已切換為${baseName()}`); checkAch();
    }
  } else if (act === 'clear') {
    askConfirm('清除所有帳目', `冬冬確定要清除全部 ${entries.length} 筆帳目嗎？此操作無法復原，建議先匯出備份喔。`, '確定清除', () => {
      entries = []; saveEntries(); saveSettings(); renderSettings(); updateSub(); toast('所有帳目已清除');
    });
  }
});

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importCsv(String(r.result)); r.readAsText(f); e.target.value = '';
});
$('jsonFile').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importFullJson(String(r.result)); r.readAsText(f); e.target.value = '';
});

/* ---------- 初始化 ---------- */
$('date').value = ymd(new Date());
syncDateQuickUI();
setType('expense');
setCur('HKD');
addAffection(0, true);
updateSub();
randomizeRoomState(true);

{
  const st = petState();
  if (st.mood === 'sleep') setFlag('woke');
  setTimeout(() => {
    const actKey = 'act_' + curAct, wKey = 'w_' + curWeather, tKey = 'tod_' + curTod;
    say((entries.length && Math.random() < .7) ? getLineAny(actKey, wKey, tKey) : moodLine(st), 6800);
    act(st.mood === 'sleep' || curAct === 'nap' ? 'yawn' : 'wave');
    checkAch();
  }, 500);
}
/* 隨時監聽頁面喚醒與真實時間變化，確保晚上打開或切換回來時背景立即跟隨現實時間 */
function syncRealTimeClock() {
  if (curTod !== getRealTod()) {
    curTod = getRealTod();
    renderRoomScene();
  }
}
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) {
    syncRealTimeClock();
    syncDateQuickUI();
  }
});
window.addEventListener('focus', syncRealTimeClock);
window.addEventListener('pageshow', syncRealTimeClock);
setInterval(syncRealTimeClock, 15000);

scheduleIdle();
updateBadge();

if (!settings.rateUpdated || Date.now() - settings.rateUpdated > 6 * 3600 * 1000) {
  fetchRate(false);
}
})();
</script>
