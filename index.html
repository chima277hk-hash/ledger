<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小克記帳">
<meta name="application-name" content="小克記帳">
<meta name="theme-color" content="#1C2038">
<link rel="manifest" href="manifest.json">
<title>小克記帳 - 溫柔陪伴記帳本</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#F4F5F8;color:#1C2038;font:16px/1.45 -apple-system,"PingFang HK","PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid #E8344E;outline-offset:2px}
.hero :focus-visible{outline-color:#fff}
[hidden]{display:none!important}
#app{max-width:520px;margin:0 auto;min-height:100dvh;background:#F4F5F8;padding-bottom:calc(92px + env(safe-area-inset-bottom))}
.num,.big,#amount{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums}

/* hero */
.hero{background:#1C2038;color:#fff;padding:calc(env(safe-area-inset-top) + 18px) 18px 26px;border-radius:0 0 30px 30px}
.heroTop{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.04em}
.sub{font-size:14px;color:rgba(255,255,255,.78);text-align:right;white-space:pre-line}
#banner{margin:12px 16px 0;background:#FFF1CC;color:#4A3A00;border-radius:12px;padding:10px 12px;font-size:14px}

.seg{display:flex;background:rgba(255,255,255,.1);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;padding:9px 6px;border-radius:9px;color:rgba(255,255,255,.7);font-weight:700}
.seg button.on{background:#fff;color:#1C2038}
.cur{margin-top:10px}
.cur button.on[data-v="HKD"]{background:#E8344E;color:#fff}
.cur button.on[data-v="CNY"]{background:#F2B731;color:#1C2038}

.amountRow{display:flex;align-items:baseline;gap:10px;margin-top:20px}
.amountRow span{font-size:26px;font-weight:700;color:#FF7A8C;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif}
body.cny .amountRow span{color:#F2B731}
#amount{width:100%;border:0;border-bottom:2px solid rgba(255,255,255,.22);background:transparent;color:#fff;font-size:52px;font-weight:700;padding:0 0 8px;border-radius:0;outline:none;caret-color:#FF7A8C}
#amount::placeholder{color:rgba(255,255,255,.28)}
#amount:focus{border-bottom-color:#FF7A8C}
body.cny #amount:focus{border-bottom-color:#F2B731}

/* body */
.body{padding:20px 16px 0}
.lbl{font-size:14px;color:#667089;margin:0 0 8px;font-weight:600}
.block{margin-top:20px}
#chips,#quick{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid #E1E4EC;background:#FFFFFF;border-radius:999px;padding:9px 15px 9px 12px;font-weight:600}
.dot{width:10px;height:10px;border-radius:50%;background:#999;flex:none}
.chip.on{background:#1C2038;border-color:#1C2038;color:#fff}
.txt{display:block;width:100%;border:1px solid #E1E4EC;border-radius:12px;padding:12px;background:#FFFFFF;min-height:46px}
#quick{margin-top:10px}
.q{border:1px solid transparent;background:#E9ECF3;border-radius:999px;padding:7px 14px;font-weight:600;font-size:15px}
.q.on{background:#1C2038;color:#fff}
.q.add{background:transparent;border:1px dashed #A4ABC0;color:#667089;font-weight:500}
.primary{width:100%;margin-top:24px;border:0;border-radius:16px;background:#E8344E;color:#fff;font-weight:800;font-size:18px;padding:16px;letter-spacing:.06em}
body.cny .primary{background:#F2B731;color:#1C2038}
.ghost{border:1px solid #E1E4EC;background:#FFFFFF;border-radius:12px;padding:10px 14px;font-weight:600}
.danger{border:1px solid #E7B9B9;background:#fff;color:#B91C1C;border-radius:12px;padding:10px 14px;font-weight:600}
#editBar{display:flex;gap:10px;margin-top:12px}
#editBar button{flex:1}
.wide{width:100%;margin-top:12px}

/* report */
.nav{display:flex;align-items:center;justify-content:space-between;margin:14px 0 0}
.nav .lab{font-weight:700;font-size:17px;text-align:center;flex:1}
.nav button{border:0;background:rgba(255,255,255,.12);color:#fff;width:42px;height:42px;border-radius:50%;font-size:22px;line-height:1}
.today{display:block;margin:4px auto 0;border:0;background:none;color:#F2B731;font-weight:700;padding:6px}
.k2{font-size:14px;color:rgba(255,255,255,.7);margin-top:16px}
.big{font-size:44px;font-weight:800;line-height:1.1;margin-top:2px}
.trio{display:flex;gap:28px;margin-top:12px}
.trio span{display:block;font-size:13px;color:rgba(255,255,255,.7)}
.trio b{font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums;font-size:18px}
.note{margin-top:12px;font-size:14px;color:#F2B731}
.bars{display:flex;align-items:flex-end;gap:3px;height:84px;margin-top:20px}
.col{flex:1;height:100%;display:flex;align-items:flex-end;min-width:0}
.bar{width:100%;border:0;background:#FF7A8C;border-radius:4px 4px 0 0;padding:0;min-height:3px}
.bar.zero{background:rgba(255,255,255,.18)}
.axis{display:flex;gap:3px;margin-top:5px}
.axis span{flex:1;height:14px;position:relative}
.axis i{position:absolute;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:rgba(255,255,255,.65);white-space:nowrap}

.panel{background:#FFFFFF;border-radius:20px;padding:16px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 12px;font-weight:700}
.ribbon{display:flex;gap:3px;height:16px;border-radius:8px;overflow:hidden;margin-bottom:14px}
.ribbon i{display:block;min-width:4px}
.lg{display:flex;align-items:center;gap:10px;padding:7px 0}
.lg .n{flex:1;font-weight:600}
.lg .p{color:#667089;font-size:14px;min-width:38px;text-align:right}
.lg .a{min-width:96px;text-align:right;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums;font-weight:700}
.gh{display:flex;justify-content:space-between;font-size:13px;color:#667089;margin:16px 0 2px;font-weight:600}
.gh:first-of-type{margin-top:0}
.row{display:flex;width:100%;align-items:center;gap:12px;text-align:left;border:0;background:transparent;padding:10px 0;border-bottom:1px solid #EEF0F5}
.row:last-child{border-bottom:0}
.ic{width:38px;height:38px;border-radius:50%;background:#667089;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}
.rc{flex:1;min-width:0}
.rc b{display:block;font-weight:700}
.rc i{display:block;font-style:normal;font-size:13px;color:#667089;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ra{text-align:right;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif;font-variant-numeric:tabular-nums}
.ra b{display:block;font-weight:700}
.ra i{display:block;font-style:normal;font-size:12px;color:#8A5A00}
.ra.income b{color:#15803D}
.empty{color:#667089;text-align:center;padding:18px 8px}

/* settings */
.line{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.line input,.add input{border:1px solid #E1E4EC;border-radius:10px;padding:9px 10px;background:#fff}
.line input{width:110px;font-family:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",system-ui,-apple-system,"PingFang HK",sans-serif}
.help{font-size:13px;color:#667089;margin-top:10px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.tag{display:inline-flex;align-items:center;gap:6px;border:1px solid #E1E4EC;border-radius:999px;padding:5px 6px 5px 12px;background:#fff;font-size:15px}
.tag button{border:0;background:#E9ECF3;border-radius:50%;width:22px;height:22px;line-height:1;padding:0;color:#667089}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0}
.pick .chip{padding:7px 12px 7px 10px;font-size:15px}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid #E1E4EC;padding-bottom:env(safe-area-inset-bottom);z-index:40}
.tabbar div{max-width:520px;margin:0 auto;display:flex}
.tabbar button{position:relative;flex:1;border:0;background:transparent;padding:9px 4px 8px;color:#7C849C;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabbar button.on{color:#E8344E}
.tabbar .dot2{position:absolute;top:7px;left:calc(50% + 9px);width:10px;height:10px;border-radius:50%;background:#E8344E;border:2px solid #fff}
#toast{white-space:pre-line;position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#1C2038;color:#fff;border-radius:12px;padding:11px 18px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(28,32,56,.3);z-index:60}
#toast.show{opacity:1}

/* 小克 */
.petTop{align-items:center}
.petTop .sub{text-align:left;white-space:pre-line;margin-top:6px;line-height:1.55}
.pet{border:0;background:none;padding:0;width:112px;flex:none;border-radius:14px;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.pet svg{display:block;width:100%;height:auto;overflow:visible;transform-origin:50% 100%;animation:bob 2s ease-in-out infinite}
.pet.nervous svg{animation:bob 1.1s ease-in-out infinite}
.pet.sleep svg{animation:breathe 3.4s ease-in-out infinite}
.pet.full1 svg,.pet.full2 svg,.pet.full3 svg{animation:sway 2.4s ease-in-out infinite}
.aL,.aR,.ey,.bub2{transform-box:fill-box}
.aL{transform-origin:100% 0}
.aR{transform-origin:0 0}
.ey{transform-origin:50% 50%}
.bub2{transform-origin:0 100%}
.gz{transition:transform .18s ease-out}
.pet.look-l .gz{transform:translateX(-1px)}
.pet.look-r .gz{transform:translateX(1px)}
.pet.look-u .gz{transform:translateY(-1px)}
.pet.look-d .gz{transform:translateY(1px)}
.pet .ey.bl{animation:blink 4.6s ease-in-out infinite}

/* 動作 */
.pet.a-jump svg{animation:jump .65s ease-out}
.pet.a-jiggle svg{animation:jig .65s ease-out}
.pet.a-cheer svg{animation:hop2 .6s ease-out 3}
.pet.a-cheer .aL,.pet.a-stretch .aL{animation:armL 1.8s ease-in-out}
.pet.a-cheer .aR,.pet.a-stretch .aR{animation:armR 1.8s ease-in-out}
.pet.a-wave .aR{animation:wave 1.9s ease-in-out}
.pet.a-dance svg{animation:dance 1.3s ease-in-out 2}
.pet.a-dance .aL{animation:danceL 1.3s ease-in-out 2}
.pet.a-dance .aR{animation:danceR 1.3s ease-in-out 2}
.pet.a-stretch svg,.pet.a-yawn svg{animation:stretch 1.8s ease-in-out}
.pet.a-sing svg{animation:sing 1.35s ease-in-out 2}
.pet.a-turn svg{animation:turn 1s ease-in-out}
.pet.a-stroll{animation:stroll 2.6s ease-in-out}
.pet.a-stroll .lg1,.pet.a-stroll .lg2{animation:step .34s linear infinite}
.pet.a-stroll .lg2{animation-delay:-.17s}
.pet.a-shiver svg{animation:shiver .1s linear 12}
.pet.a-sigh svg{animation:sigh 1.8s ease-in-out}
.pet.a-snore svg{animation:snore 1.6s ease-in-out}
.pet.a-waddle svg{animation:waddle .9s ease-in-out 2}
.pet.a-dizzy svg{animation:dizzy 1.8s ease-in-out}
.pet.a-think svg{animation:tilt 2.3s ease-in-out}

/* 特效 */
.fxz{animation:zf 2.4s ease-in-out infinite}
.bub2{animation:bubl 3s ease-in-out infinite}
.burp{animation:bp 2.8s ease-in-out infinite}
.drip{animation:drip 1.4s ease-in infinite}
.rise{animation:rise 1.7s ease-out infinite}
.coin{animation:cf .9s ease-in infinite}
.tw{animation:tw 1.1s ease-in-out infinite}
.dd{animation:dd 1.8s ease-in-out infinite}
.orb1{animation:orb 1s ease-in-out infinite alternate}
.orb2{animation:orb 1s ease-in-out infinite alternate-reverse}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.94)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(.1)}}
@keyframes jump{0%{transform:translateY(0) scale(1.1,.88)}35%{transform:translateY(-24%) scale(.94,1.08)}70%{transform:translateY(0) scale(1.08,.9)}100%{transform:none}}
@keyframes jig{0%{transform:scale(1)}20%{transform:scale(1.14,.86)}45%{transform:scale(.92,1.1)}70%{transform:scale(1.05,.96)}100%{transform:scale(1)}}
@keyframes hop2{0%{transform:translateY(0) scale(1.06,.92)}40%{transform:translateY(-18%) scale(.96,1.05)}80%,100%{transform:none}}
@keyframes dance{0%,100%{transform:none}25%{transform:translateY(-8%) rotate(-7deg)}50%{transform:none}75%{transform:translateY(-8%) rotate(7deg)}}
@keyframes danceL{0%,50%,100%{transform:none}25%{transform:rotate(130deg)}}
@keyframes danceR{0%,50%,100%{transform:none}75%{transform:rotate(-130deg)}}
@keyframes armL{0%,100%{transform:none}15%,45%,85%{transform:rotate(155deg)}30%,60%{transform:rotate(172deg)}}
@keyframes armR{0%,100%{transform:none}15%,45%,85%{transform:rotate(-155deg)}30%,60%{transform:rotate(-172deg)}}
@keyframes wave{0%,100%{transform:none}12%,36%,60%,84%{transform:rotate(-128deg)}24%,48%,72%{transform:rotate(-156deg)}}
@keyframes stretch{0%,100%{transform:none}30%,70%{transform:scale(.9,1.17)}}
@keyframes sing{0%,100%{transform:rotate(0)}25%{transform:rotate(-5deg) translateY(-3%)}75%{transform:rotate(5deg) translateY(-3%)}}
@keyframes turn{0%,100%{transform:scaleX(1)}35%,55%{transform:scaleX(.06)}}
@keyframes stroll{0%,100%{transform:none}30%,60%{transform:translateX(-18px)}}
@keyframes step{0%,100%{transform:translateY(0)}50%{transform:translateY(-1px)}}
@keyframes shiver{0%,100%{transform:translateX(0)}25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
@keyframes sigh{0%,100%{transform:none}40%,70%{transform:scale(1.04,.9)}}
@keyframes snore{0%,100%{transform:scale(1)}45%{transform:scale(1.06,.96)}}
@keyframes waddle{0%,100%{transform:rotate(-5deg) translateX(-2%)}50%{transform:rotate(5deg) translateX(2%)}}
@keyframes dizzy{0%,100%{transform:rotate(0)}15%{transform:rotate(-9deg)}35%{transform:rotate(8deg)}55%{transform:rotate(-6deg)}75%{transform:rotate(5deg)}}
@keyframes tilt{0%,100%{transform:none}25%,75%{transform:rotate(-8deg)}}
@keyframes zf{0%,100%{opacity:.3}50%{opacity:1}}
@keyframes bp{0%,100%{opacity:0}40%,70%{opacity:.95}}
@keyframes bubl{0%{transform:scale(.3);opacity:0}30%{opacity:1}80%{transform:scale(1.4);opacity:1}100%{transform:scale(1.5);opacity:0}}
@keyframes drip{0%{transform:translateY(-1px);opacity:0}30%{opacity:1}100%{transform:translateY(2px);opacity:0}}
@keyframes rise{0%{transform:translateY(2px);opacity:0}20%{opacity:1}100%{transform:translateY(-6px);opacity:0}}
@keyframes cf{0%{transform:translateY(0);opacity:0}15%,85%{opacity:1}100%{transform:translateY(9px);opacity:0}}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
@keyframes dd{0%,15%{opacity:0}35%,85%{opacity:1}100%{opacity:0}}
@keyframes orb{from{transform:translateX(-6px)}to{transform:translateX(6px)}}

.bubble{position:relative;background:#fff;color:#1C2038;border-radius:16px;padding:12px 15px 12px;margin:4px 0 16px;font-size:15px;line-height:1.55;box-shadow:0 4px 12px rgba(0,0,0,.08)}
.bubble::before{content:"";position:absolute;top:-8px;right:48px;border:8px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble .bn{display:block;font-size:12px;color:#B4532F;font-weight:800;margin-bottom:2px}
.bubble.pop{animation:pop .3s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(-6px) scale(.97)}to{opacity:1;transform:none}}

/* achievements */
.lv{display:flex;align-items:center;gap:10px;margin-top:6px}
.lvb{background:#D97757;color:#fff;font-weight:800;border-radius:8px;padding:2px 9px;font-size:14px}
.lvt{font-size:22px;font-weight:800}
.pbar{height:12px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden;margin-top:16px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#D97757,#F2B731);border-radius:6px;transition:width .6s}
.pnote{margin-top:8px;font-size:14px;color:rgba(255,255,255,.72)}
.agrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.acard{border:0;background:#fff;border-radius:16px;border-top:4px solid var(--c);padding:14px 6px 10px;min-height:116px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.acard .ai{font-size:32px;line-height:1.15}
.acard b{font-size:13px;font-weight:700;line-height:1.3}
.acard i{font-style:normal;font-size:11px;color:#667089}
.acard.lock{background:#E3E6EE;border-top-color:#C9CEDB}
.acard.lock .ai,.acard.lock b{color:#8E96AD}
.acard.lock .ai{font-weight:800;font-size:30px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(28,32,56,.64);display:grid;place-items:center;padding:20px}
.mcard{position:relative;background:#fff;border-radius:24px;padding:22px 20px 20px;width:100%;max-width:340px;max-height:88dvh;overflow:auto;text-align:center;animation:mpop .4s cubic-bezier(.2,1.4,.4,1)}
@keyframes mpop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
.mtag{font-size:14px;font-weight:700;color:#667089}
.micon{width:96px;height:96px;margin:14px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:color-mix(in srgb,var(--c) 16%,#fff);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 38%,#fff)}
.mcard.fresh .micon{animation:shine 1.4s ease-out}
@keyframes shine{0%{transform:scale(.4) rotate(-40deg)}60%{transform:scale(1.15) rotate(8deg)}100%{transform:none}}
.mname{font-size:21px;font-weight:800}
.mdesc{font-size:14px;color:#667089;margin-top:2px}
.msay{display:flex;gap:10px;align-items:center;text-align:left;background:#FFF1E8;border-radius:14px;padding:10px 12px;margin-top:16px;font-size:15px;line-height:1.45}
.mpet{width:56px;flex:none}
.mpet svg{display:block;width:100%;height:auto}
.mrest{margin-top:14px;font-size:13px;color:#667089;text-align:left}
.mrest span{display:inline-block;margin:6px 6px 0 0;padding:3px 10px;border-radius:999px;background:#F0F2F7;color:#1C2038}
.mok{margin-top:18px;padding:13px}
#confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none}
#confetti i{position:absolute;top:-14px;width:8px;height:13px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(var(--r))}}

@media (prefers-reduced-motion:reduce){
  #toast{transition:none}
  .pet,.pet svg,.pet svg *,.mcard,.mcard .micon,.bubble.pop,.pbar i{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app">
  <div id="banner" hidden>目前無法儲存資料，關閉分頁後記錄會消失。請使用手機 Safari 或 Chrome 等瀏覽器開啟。</div>

  <!-- 記帳主頁 -->
  <section id="tab-add">
    <div class="hero">
      <div class="heroTop petTop">
        <div><h1 id="title">記帳</h1><div class="sub num" id="sub"></div></div>
        <button class="pet" id="pet" type="button" aria-label="小克"></button>
      </div>
      <div class="bubble" id="bubble" hidden></div>
      <div class="seg" id="typeSeg" role="group" aria-label="類型">
        <button data-v="expense" class="on">支出</button><button data-v="income">收入</button>
      </div>
      <div class="seg cur" id="curSeg" role="group" aria-label="幣別">
        <button data-v="HKD" class="on">港幣 HK$</button><button data-v="CNY">人民幣 ¥</button>
      </div>
      <div class="amountRow">
        <span id="sym">HK$</span>
        <input id="amount" type="number" inputmode="decimal" step="0.01" min="0" placeholder="0.00" autocomplete="off" aria-label="金額">
      </div>
    </div>
    <div class="body">
      <div class="lbl">分類</div>
      <div id="chips"></div>
      <div class="block">
        <div class="lbl">備註</div>
        <input class="txt" type="text" id="note" placeholder="選填，或點擊下方常用備註" autocomplete="off">
        <div id="quick"></div>
      </div>
      <div class="block">
        <div class="lbl">日期</div>
        <input class="txt" type="date" id="date">
      </div>
      <button class="primary" id="save">記一筆</button>
      <button class="ghost wide" id="nospend" type="button">🍃 今天沒有花錢</button>
      <div id="editBar" hidden>
        <button class="danger" id="del">刪除這筆</button>
        <button class="ghost" id="cancel">取消修改</button>

    <div class="hero"><div class="heroTop" style="margin:0"><h1>設定</h1></div></div>
    <div class="body" id="setBody"></div>
  </section>
</div>

<!-- 底部導航欄 -->
<nav class="tabbar" aria-label="主選單"><div>
  <button data-tab="add" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>記帳</button>
  <button data-tab="report"><svg viewBox="0 0 24 24"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>報表</button>
  <button data-tab="ach"><svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0V4zM8 6H5v1a3 3 0 0 0 3 3M16 6h3v1a3 3 0 0 1-3 3M12 13v4M8 20h8"/></svg>成就<span class="dot2" id="achDot" hidden></span></button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>設定</button>
</div></nav>

<div id="toast" role="status" aria-live="polite"></div>
<div class="modal" id="modal" hidden role="dialog" aria-modal="true"><div id="confetti"></div><div class="mcard" id="mcard"></div></div>
<input type="file" id="file" accept=".csv,text/csv" hidden>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const startOfWeek = d => { const x = new Date(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); x.setHours(0, 0, 0, 0); return x; };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const round2 = n => Math.round(n * 100) / 100;
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const WD = ['日', '一', '二', '三', '四', '五', '六'];

const CAT_COLORS = {
  '餐飲': '#C2570C', '交通': '#2563EB', '日常用品': '#0F766E', '服飾裝扮': '#BE185D',
  '娛樂愛好': '#7C3AED', '外出消遣': '#0891B2', '醫療': '#B91C1C', '其他': '#64748B',
  '薪資': '#15803D', '其他收入': '#0E7490',
  '居住': '#0F766E', '購物': '#BE185D', '娛樂': '#7C3AED'
};
const EXTRA = ['#9333EA', '#0369A1', '#A16207', '#BE123C', '#4D7C0F', '#6D28D9'];
const colorOf = c => CAT_COLORS[c] || EXTRA[[...String(c)].reduce((s, ch) => s + ch.charCodeAt(0), 0) % EXTRA.length];

/* ---------- 儲存 ---------- */
const store = (() => {
  const mem = {}; let ok = true;
  try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { ok = false; }
  return {
    get persistent() { return ok; },
    get(k, d) {
      try { if (ok) { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } } catch (e) {}
      return k in mem ? mem[k] : d;
    },
    set(k, v) {
      mem[k] = v;
      if (ok) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { ok = false; $('banner').hidden = false; } }
    }
  };
})();
if (!store.persistent) $('banner').hidden = false;
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- 資料結構與設定 ---------- */
const DEFAULT_CATS = {
  expense: ['餐飲', '交通', '日常用品', '服飾裝扮', '娛樂愛好', '外出消遣', '醫療', '其他'],
  income: ['薪資', '其他收入']
};
const OLD_CATS = ['居住', '購物', '娛樂'];

let entries = store.get('ledger.entries', []);
let settings = Object.assign({
  hkdToRmb: 0.9200,      /* 1 港幣 = hkdToRmb 人民幣 */
  rateUpdated: null,
  cats: JSON.parse(JSON.stringify(DEFAULT_CATS)),
  quick: { '交通': ['上下學', '地鐵', '打車'], '餐飲': ['早餐', '午餐', '晚餐', '咖啡', '奶茶'] },
  dismissed: [],
  budget: 0,             /* 每月預算（人民幣 ¥） */
  petName: '小克',
  ach: {}, achSeen: 0, noSpend: [], flags: {}
}, store.get('ledger.settings', {}));

const saveEntries = () => store.set('ledger.entries', entries);
const saveSettings = () => store.set('ledger.settings', settings);

/* 核心統計統一為人民幣 ¥ */
const sym = () => '¥';
const money = n => '¥' + fmt(n);
const val = e => e.cny;
const sumBase = a => a.reduce((s, e) => s + val(e), 0);

/* 計算雙幣金額 */
const calcDual = (amt, cur, rateHkdToRmb) => {
  const r = rateHkdToRmb || settings.hkdToRmb || 0.92;
  if (cur === 'HKD') {
    return { hkd: round2(amt), cny: round2(amt * r) };
  } else {
    return { cny: round2(amt), hkd: round2(amt / r) };
  }
};

/* 舊版資料相容與平滑升級 */
(() => {
  let dirtyEntries = false, dirtySettings = false;
  if (!settings.hkdToRmb) {
    if (settings.rate && settings.rate > 0) {
      settings.hkdToRmb = settings.rate > 1 ? +(1 / settings.rate).toFixed(4) : +settings.rate.toFixed(4);
    } else {
      settings.hkdToRmb = 0.9200;
    }
    dirtySettings = true;
  }
  entries.forEach(e => {
    if (e.cny == null || e.hkd == null) {
      const r = settings.hkdToRmb;
      const d = calcDual(e.amount, e.cur || 'HKD', r);
      e.hkd = d.hkd; e.cny = d.cny; e.rate = r;
      dirtyEntries = true;
    } else if (e.rate > 1.0) {
      e.rate = +(1 / e.rate).toFixed(4);
      dirtyEntries = true;
    }
  });
  if (dirtyEntries) saveEntries();
  if (dirtySettings) saveSettings();
})();

// 註冊 Service Worker
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}

/* ---------- 提示與標籤 ---------- */
let toastTimer;
function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}
function mark(seg, v) {
  seg.querySelectorAll('button').forEach(b => {
    const on = b.dataset.v === v;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on);
  });
}

/* ---------- 記帳表單 ---------- */
const form = { type: 'expense', cur: 'HKD', cat: '', editId: null };

function renderChips() {
  const list = settings.cats[form.type].slice();
  if (form.cat && !list.includes(form.cat)) list.push(form.cat);
  $('chips').innerHTML = list.map(c =>
    `<button class="chip${c === form.cat ? ' on' : ''}" data-c="${esc(c)}" aria-pressed="${c === form.cat}">
      <span class="dot" style="background:${colorOf(c)}"></span>${esc(c)}
    </button>`
  ).join('');
  renderQuick();
}

function renderQuick() {
  const note = $('note').value.trim();
  const list = (form.cat && settings.quick[form.cat]) || [];
  const col = form.cat ? colorOf(form.cat) : '#667089';
  let h = list.map(q => `<button class="q${q === note ? ' on' : ''}" style="${q === note ? `background:${col};color:#fff` : `background:color-mix(in srgb,${col} 14%,#fff)`}" data-q="${esc(q)}">${esc(q)}</button>`).join('');
  if (form.cat && note && !list.includes(note)) h += `<button class="q add" data-qadd="1">＋ 存為「${esc(form.cat)}」常用備註</button>`;
  $('quick').innerHTML = h;
  $('quick').hidden = !h;
}

function setType(t) {
  form.type = t; form.cat = '';
  mark($('typeSeg'), t);
  renderChips();
}

function setCur(c) {
  form.cur = c;
  mark($('curSeg'), c);
  $('sym').textContent = c === 'HKD' ? 'HK$' : '¥';
  document.body.classList.toggle('cny', c === 'CNY');
}

function updateSub() {
  const st = refreshPet(); refreshNoSpend();
  if ($('tab-add').hidden) return;
  if (form.editId) { $('sub').textContent = '正在修改帳目'; return; }
  const today = ymd(new Date());
  const t = sumBase(entries.filter(e => e.type === 'expense' && e.date === today));
  let s = `今日支出 ¥${fmt(t)}`;
  if (st.b) {
    s += '\n' + (st.over > 0 ? `本月超支 ¥${fmt(st.spent - st.b)}` : `本月還剩 ¥${fmt(st.b - st.spent)}`);
  }
  if (st.streak >= 2) s += `\n🔥 連續記帳 ${st.streak} 天`;
  $('sub').textContent = s;
}

function refreshNoSpend() {
  const t = ymd(new Date());
  const spent = entries.some(e => e.type === 'expense' && e.date === t), marked = settings.noSpend.includes(t);
  const b = $('nospend'); b.hidden = !!form.editId || spent;
  b.textContent = marked ? '✓ 今天已標記沒花錢（點擊取消）' : '🍃 今天沒有花錢';
}

function resetForm() {
  form.editId = null; $('amount').value = ''; $('note').value = '';
  $('date').value = ymd(new Date());
  $('save').textContent = '記一筆'; $('editBar').hidden = true; $('title').textContent = '記帳';
  updateSub(); renderQuick();
}

function saveEntry() {
  const amt = parseFloat($('amount').value);
  if (!(amt > 0)) { toast('請輸入大於 0 的金額'); return; }
  const old = form.editId ? entries.find(x => x.id === form.editId) : null;
  let r = old && old.rate ? old.rate : settings.hkdToRmb;
  r = Math.round(r * 1e6) / 1e6;
  if (!form.cat) { toast('請選擇一個分類'); return; }

  const dual = calcDual(amt, form.cur, r);
  const e = {
    id: form.editId || uid(),
    type: form.type,
    cur: form.cur,
    amount: round2(amt),
    rate: r,
    hkd: dual.hkd,
    cny: dual.cny,
    cat: form.cat,
    note: $('note').value.trim(),
    date: $('date').value || ymd(new Date()),
    ts: old ? old.ts : Date.now()
  };

  const i = entries.findIndex(x => x.id === e.id);
  if (i >= 0) entries[i] = e; else entries.push(e);
  saveEntries();

  const wasEdit = !!form.editId, keepDate = $('date').value;
  const auto = autoQuick(e);
  resetForm();
  if (!wasEdit && keepDate) $('date').value = keepDate;

  const tipText = (wasEdit ? '已更新：' : '已記錄：') + (e.cur === 'HKD' ? `HK$${fmt(e.amount)}（折合 ¥${fmt(e.cny)}）` : `¥${fmt(e.amount)}`) + (auto ? `\n「${e.note}」已加入「${e.cat}」常用備註` : '');
  toast(tipText);
  if (wasEdit) setFlag('edited');
  petReact(e, wasEdit);
  checkAch();
}

const AUTO_QUICK_AT = 5;
function autoQuick(e) {
  if (!e.note) return false;
  const l = settings.quick[e.cat] = settings.quick[e.cat] || [];
  if (l.includes(e.note) || settings.dismissed.includes(e.cat + '|' + e.note)) return false;
  const n = entries.filter(x => x.cat === e.cat && x.note === e.note).length;
  if (n < AUTO_QUICK_AT) return false;
  l.push(e.note); saveSettings();
  return true;
}

function startEdit(id) {
  const e = entries.find(x => x.id === id); if (!e) return;
  form.editId = id; form.type = e.type; form.cat = e.cat; mark($('typeSeg'), e.type);
  $('note').value = e.note || '';
  setCur(e.cur); renderChips();
  $('amount').value = e.amount; $('date').value = e.date;
  $('save').textContent = '更新'; $('editBar').hidden = false; $('title').textContent = '修改帳目';
  showTab('add');
}

function deleteEntry() {
  if (!form.editId) return;
  if (!confirm('確定刪除這筆帳目嗎？')) return;
  entries = entries.filter(x => x.id !== form.editId);
  saveEntries(); resetForm(); toast('已刪除帳目');
}

/* ---------- 報表模組 ---------- */
const rep = { mode: 'day', anchor: new Date() };
function range() {
  const a = new Date(rep.anchor); a.setHours(0, 0, 0, 0);
  if (rep.mode === 'day') return [a, a];
  if (rep.mode === 'week') { const s = startOfWeek(a); return [s, addDays(s, 6)]; }
  return [new Date(a.getFullYear(), a.getMonth(), 1), new Date(a.getFullYear(), a.getMonth() + 1, 0)];
}
function shift(n) {
  const a = new Date(rep.anchor);
  if (rep.mode === 'day') a.setDate(a.getDate() + n);
  else if (rep.mode === 'week') a.setDate(a.getDate() + 7 * n);
  else { a.setDate(1); a.setMonth(a.getMonth() + n); }
  rep.anchor = a;
}
function rangeLabel(f, t) {
  if (rep.mode === 'day') return `${f.getFullYear()}年${f.getMonth() + 1}月${f.getDate()}日 週${WD[f.getDay()]}`;
  if (rep.mode === 'week') return `${f.getMonth() + 1}月${f.getDate()}日 至 ${t.getMonth() + 1}月${t.getDate()}日`;
  return `${f.getFullYear()}年${f.getMonth() + 1}月`;
}

function renderReport() {
  const [f, t] = range(), fs = ymd(f), ts = ymd(t), todayS = ymd(new Date());
  const list = entries.filter(e => e.date >= fs && e.date <= ts);
  const exp = list.filter(e => e.type === 'expense'), inc = list.filter(e => e.type === 'income');
  const E = sumBase(exp), I = sumBase(inc), net = I - E;
  const hkdList = exp.filter(e => e.cur === 'HKD');
  const isCurrent = todayS >= fs && todayS <= ts;
  const unit = { day: '日', week: '週', month: '月' }[rep.mode];

  let h = `<div class="hero"><div class="heroTop"><h1>報表</h1></div>
    <div class="seg" id="modeSeg">${[['day', '日'], ['week', '週'], ['month', '月']].map(([v, n]) => `<button data-mode="${v}" class="${rep.mode === v ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="nav"><button data-nav="-1" aria-label="上一${unit}">‹</button><div class="lab">${rangeLabel(f, t)}</div><button data-nav="1" aria-label="下一${unit}">›</button></div>`;
  if (!isCurrent) h += `<button class="today" data-nav="today">回到本${unit}</button>`;
  h += `<div class="k2">支出（折合人民幣）</div><div class="big">¥${fmt(E)}</div>
    <div class="trio"><div><span>收入</span><b>¥${fmt(I)}</b></div><div><span>結餘</span><b>${net < 0 ? '−' : ''}¥${fmt(Math.abs(net))}</b></div></div>`;
  if (hkdList.length) {
    const rawHkdSum = hkdList.reduce((s, e) => s + e.amount, 0);
    h += `<div class="note">含港幣支出 HK$${fmt(rawHkdSum)}，已折合 ¥${fmt(sumBase(hkdList))}</div>`;
  }

  if (rep.mode !== 'day') {
    const days = []; for (let d = new Date(f); d <= t; d = addDays(d, 1)) days.push(new Date(d));
    const per = days.map(d => sumBase(exp.filter(e => e.date === ymd(d))));
    const mx = Math.max(...per, 1);
    h += `<div class="bars">${days.map((d, i) =>
      `<div class="col"><button class="bar${per[i] ? '' : ' zero'}" data-d="${ymd(d)}" style="height:${per[i] ? Math.max(per[i] / mx * 100, 5) : 3}%" aria-label="${d.getMonth() + 1}月${d.getDate()}日 ¥${fmt(per[i])}"></button></div>`).join('')}</div>
      <div class="axis">${days.map((d, i) => {
        const txt = rep.mode === 'week' ? WD[d.getDay()] : ((d.getDate() - 1) % 5 === 0 || i === days.length - 1 ? d.getDate() : '');
        return `<span><i>${txt}</i></span>`;
      }).join('')}</div>`;
  }
  h += '</div><div class="body">';

  const by = {}; exp.forEach(e => by[e.cat] = (by[e.cat] || 0) + val(e));
  const cats = Object.entries(by).sort((a, b) => b[1] - a[1]);
  h += '<div class="panel"><h2>支出分類</h2>';
  if (cats.length) {
    h += `<div class="ribbon">${cats.map(([c, v]) => `<i style="flex:${v};background:${colorOf(c)}"></i>`).join('')}</div>`;
    h += cats.map(([c, v]) => `<div class="lg"><span class="dot" style="background:${colorOf(c)}"></span><span class="n">${esc(c)}</span><span class="p">${Math.round(v / E * 100)}%</span><span class="a">¥${fmt(v)}</span></div>`).join('');
  } else h += '<div class="empty">這段時間沒有支出記錄</div>';
  h += '</div>';

  h += '<div class="panel"><h2>明細</h2>';
  if (!list.length) h += '<div class="empty">還沒有任何記錄。到「記帳」記下美好的一筆吧。</div>';
  else {
    [...new Set(list.map(e => e.date))].sort().reverse().forEach(ds => {
      const items = list.filter(e => e.date === ds).sort((a, b) => b.id < a.id ? -1 : 1);
      if (rep.mode !== 'day') {
        const d = new Date(ds + 'T00:00:00');
        h += `<div class="gh"><span>${d.getMonth() + 1}月${d.getDate()}日 週${WD[d.getDay()]}</span><span class="num">支出 ¥${fmt(sumBase(items.filter(e => e.type === 'expense')))}</span></div>`;
      }
      items.forEach(e => {
        const sign = e.type === 'expense' ? '−' : '+';
        const displayCur = e.cur === 'HKD' ? `HK$${fmt(e.amount)}` : `¥${fmt(e.amount)}`;
        const subConverted = e.cur === 'HKD' ? `折合 ¥${fmt(e.cny)}（匯率 ${e.rate}）` : '';
        h += `<button class="row" data-id="${e.id}">
          <span class="ic" style="background:${colorOf(e.cat)}">${esc([...e.cat][0])}</span>
          <span class="rc"><b>${esc(e.cat)}</b>${e.note ? `<i>${esc(e.note)}</i>` : ''}</span>
          <span class="ra ${e.type}"><b>${sign}${displayCur}</b>${subConverted ? `<i>${subConverted}</i>` : ''}</span>
        </button>`;
      });
    });
  }
  h += '</div></div>';
  $('tab-report').innerHTML = h;
}

/* ---------- 設定頁面 ---------- */
let qSel = null;
function renderSettings() {
  const upd = settings.rateUpdated ? new Date(settings.rateUpdated).toLocaleString('zh-HK', { hour12: false }) : '尚未自動更新';
  const tags = t => settings.cats[t].map(c => `<span class="tag">${esc(c)}<button data-act="delcat" data-t="${t}" data-c="${esc(c)}" aria-label="刪除 ${esc(c)}">×</button></span>`).join('');
  const allCats = settings.cats.expense.concat(settings.cats.income);
  if (!qSel || !allCats.includes(qSel)) qSel = allCats[0];
  const qs = settings.quick[qSel] || [];

  $('setBody').innerHTML = `
  <div class="panel"><h2>每月預算與${esc(petName())}</h2>
    <div class="line"><span>每月預算 ¥</span><input id="setBudget" type="number" inputmode="decimal" step="1" min="0" value="${settings.budget || ''}" placeholder="例如 4000"></div>
    <div class="help">預算以人民幣計算，港幣消費會依記錄時的匯率折合。如果超過預算，${esc(petName())}會心疼地為你吃成圓滾滾的小胖子喔；留空代表不設預算。</div>
    <div class="line" style="margin-top:12px"><span>伴侶名字</span><input id="setPet" maxlength="8" value="${esc(petName())}" style="font-family:inherit"></div></div>

  <div class="panel"><h2>匯率設定（港幣 HKD → 人民幣 RMB）</h2>
    <div class="line">
      <span>1 港幣 =</span>
      <input id="setRate" type="number" inputmode="decimal" step="0.0001" value="${settings.hkdToRmb}">
      <span>人民幣</span>
      <button class="ghost" data-act="fetchRate">連網更新匯率</button>
    </div>
    <div class="help">最後更新時間：${upd}。<br>記帳時會自動以最新匯率計算並鎖定於該筆帳目，日後匯率波動不會影響過去的歷史記錄。</div>

/* 連網更新最新匯率 */
let isFetchingRate = false;
async function fetchRate(manual) {
  if (isFetchingRate) return;
  isFetchingRate = true;
  const btns = document.querySelectorAll('[data-act="fetchRate"]');
  btns.forEach(b => { b.classList.add('loading'); if (b.tagName === 'BUTTON') b.textContent = '更新中...'; });

  let success = false;
  try {
    const ctrl = new AbortController();
    const tm = setTimeout(() => ctrl.abort(), 6500);
    const res = await fetch('https://open.er-api.com/v6/latest/HKD', { signal: ctrl.signal });
    clearTimeout(tm);
    if (res.ok) {
      const data = await res.json();
      if (data && data.rates && data.rates.CNY > 0) {
        settings.hkdToRmb = +data.rates.CNY.toFixed(4);
        settings.rateUpdated = Date.now();
        saveSettings();
        success = true;
      }
    }
  } catch (e1) {
    try {
      const ctrl2 = new AbortController();
      const tm2 = setTimeout(() => ctrl2.abort(), 6000);
      const res2 = await fetch('https://api.exchangerate-api.com/v4/latest/HKD', { signal: ctrl2.signal });
      clearTimeout(tm2);
      if (res2.ok) {
        const data2 = await res2.json();
        if (data2 && data2.rates && data2.rates.CNY > 0) {
          settings.hkdToRmb = +data2.rates.CNY.toFixed(4);
          settings.rateUpdated = Date.now();
          saveSettings();
          success = true;
        }
      }
    } catch (e2) {}
  } finally {
    isFetchingRate = false;
    btns.forEach(b => {
      b.classList.remove('loading');
      if (b.dataset.act === 'fetchRate') b.textContent = '連網更新匯率';
    });
  }

  if (success) {
    if (!$('tab-settings').hidden) renderSettings();
    if (manual) toast(`✨ 匯率已更新！\n1 港幣 = ${settings.hkdToRmb} 人民幣`);
  } else {
    if (manual) toast('連線失敗，請檢查網路或手動輸入匯率');
  }
}

/* ---------- CSV 匯入與匯出 ---------- */
const csvCell = v => { const s = String(v == null ? '' : v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
function exportCsv() {
  const head = ['date', 'type', 'currency', 'amount', 'rate_hkd_to_rmb', 'hkd', 'rmb', 'category', 'note'];
  const rows = entries.map(e => [e.date, e.type, e.cur, e.amount, e.rate, e.hkd, e.cny, e.cat, e.note])
    .concat(settings.noSpend.map(d => [d, 'nospend', 'HKD', 0, settings.hkdToRmb, 0, 0, '', '']))
    .sort((a, b) => a[0] < b[0] ? -1 : a[0] > b[0] ? 1 : 0);
  const csv = '\ufeff' + [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = `ledger-backup-${ymd(new Date()).replace(/-/g, '')}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  setFlag('exported'); checkAch();
}

function parseCsv(text) {
  text = text.replace(/^\ufeff/, ''); const rows = []; let row = [], cell = '', q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
    else if (c === '"') q = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n' || c === '\r') { if (c === '\r' && text[i + 1] === '\n') i++; row.push(cell); cell = ''; rows.push(row); row = []; }
    else cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows.filter(r => r.some(x => x !== ''));
}

function importCsv(text) {
  const rows = parseCsv(text); if (rows.length < 2) { toast('檔案沒有有效內容'); return; }
  const h = rows[0].map(x => x.trim().toLowerCase()); const col = n => h.indexOf(n);
  if (col('date') < 0 || col('amount') < 0) { toast('格式不相符，請使用本記帳本匯出的 CSV'); return; }
  const key = e => [e.date, e.type, e.cur, e.amount, e.cat, e.note].join('|');
  const have = new Set(entries.map(key)); let added = 0, skipped = 0;

  rows.slice(1).forEach(r => {
    const g = n => (col(n) >= 0 ? r[col(n)] : '') || '';
    if (g('type') === 'nospend') {
      if (/^\d{4}-\d{2}-\d{2}$/.test(g('date')) && !settings.noSpend.includes(g('date'))) {
        settings.noSpend.push(g('date')); added++;
      } else skipped++;
      return;
    }
    const type = g('type') === 'income' ? 'income' : 'expense';
    const cur = g('currency') === 'CNY' ? 'CNY' : 'HKD';
    const amount = round2(parseFloat(g('amount')));
    if (!/^\d{4}-\d{2}-\d{2}$/.test(g('date')) || !(amount > 0)) { skipped++; return; }

    let rate = parseFloat(g('rate_hkd_to_rmb')) || parseFloat(g('rate')) || settings.hkdToRmb;
    if (rate > 1.0) rate = +(1 / rate).toFixed(4);
    const dual = calcDual(amount, cur, rate);
    const e = {
      id: uid(), type, cur, amount, rate,
      hkd: dual.hkd, cny: dual.cny,
      cat: g('category') || '其他',
      note: g('note') || '',
      date: g('date'),
      ts: Date.now()
    };
    if (have.has(key(e))) { skipped++; return; }
    have.add(key(e)); entries.push(e); added++;
    if (!settings.cats[type].includes(e.cat) && !OLD_CATS.includes(e.cat)) settings.cats[type].push(e.cat);
  });

  saveEntries(); saveSettings(); renderChips(); renderSettings(); updateSub();
  toast(`成功匯入 ${added} 筆帳目，略過 ${skipped} 筆重複記錄`);
  setFlag('imported'); checkAch();
}

function streakInfo() {

  list.forEach(([f, d]) => { seqT.push(setTimeout(() => setFace(f, 0, true), t)); t += d; });
  seqT.push(setTimeout(() => setFace(petMood, 0, true), t));

const chew = () => faceSeq([['nom1', 420], ['nom2', 300], ['nom1', 420], ['nom2', 300], ['grin', 700]]);

const ACTS = {
  jump: { ms: 650 }, jiggle: { ms: 650 }, wave: { ms: 1900, face: 'grin' }, cheer: { ms: 1900, face: 'star' },
  dance: { ms: 2600, face: 'grin' }, stretch: { ms: 1800, face: 'yawn' }, yawn: { ms: 1900, face: 'yawn' }, sing: { ms: 2700, face: 'sing' },

function act(name, faceOverride) {

  const el = $('pet'); Object.keys(ACTS).forEach(k => el.classList.remove('a-' + k)); void el.offsetWidth;

function wpick(list) { let r = Math.random() * list.reduce((s, x) => s + x[1], 0); for (const x of list) { if ((r -= x[1]) < 0) return x[0]; } return list[0][0]; }
function runIdle(n) {
  (IDLE_ACT[n] || (() => act(n)))();
  if ($('bubble').hidden && Math.random() < .45) say(getLine('idle'), 4200);
}
function idleTick() {
  if (document.hidden || $('tab-add').hidden || modalOpen || Date.now() < busyUntil) return;
  const h = new Date().getHours();
  if ((h >= 23 || h < 5) && petMood !== 'sleep' && Math.random() < .35) { act('yawn'); return; }
  runIdle(wpick(IDLE[petMood] || IDLE.calm));
}

function timeCategory() {
  const h = new Date().getHours();
  if (h >= 0 && h < 5) return 'lateNight';
  if (h >= 5 && h < 7) return 'early';
  if (h >= 7 && h < 11) return 'morning';
  if (h >= 11 && h < 14) return 'noon';
  if (h >= 14 && h < 18) return 'afternoon';
  if (h >= 18 && h < 22) return 'evening';
  return 'night';
}

function moodLine(st) {
  if (!entries.length && !settings.noSpend.length) return getLine('meet');
  if (Math.random() < .35) return getLine(timeCategory());
  if (!st.b && Math.random() < .3) return getLine('noBudget');
  return getLine(st.mood);
}

function petReact(e, wasEdit) {
  const st = refreshPet(), fat = st.mood.indexOf('full') === 0;
  if (wasEdit) { act('jump'); setFace('wink', 1400); say(getLine('edit')); return; }
  const first = entries.filter(x => x.date === e.date).length === 1;
  const si = streakInfo(); let line;

  if (e.type === 'income') {
    act('cheer', 'money'); line = getLine('income');
  } else if (fat) {
    act('jiggle'); chew(); line = getLine(st.mood);
  } else if (first && e.date === ymd(new Date()) && [3, 7, 14, 30, 60, 100, 365].includes(si.cur)) {
    act('dance'); line = streakLine(si.cur);
  } else if (e.cny >= 500 || e.amount >= 500) {
    act('jump'); setFace('wow', 1500); line = getLine('big');
  } else if (e.cat === '餐飲') {
    act('jump'); chew(); line = Math.random() < 0.6 ? getLine('savedFood') : getLine('saved');
  } else if (e.cat === '交通') {
    act('jump'); line = Math.random() < 0.6 ? getLine('savedTraffic') : getLine('saved');
  } else if (e.cat === '服飾裝扮') {
    act('cheer', 'star'); line = Math.random() < 0.6 ? getLine('savedCloth') : getLine('saved');
  } else if (e.cat === '娛樂愛好' || e.cat === '外出消遣') {
    act('dance'); line = Math.random() < 0.6 ? getLine('savedPlay') : getLine('saved');
  } else if (st.mood === 'nervous') {
    chew(); line = getLine('nervous');
  } else {
    act('jump'); chew(); line = getLine('saved');
  }
  say(line);
}

function toggleNoSpend() {
  const t = ymd(new Date()), i = settings.noSpend.indexOf(t);
  if (i >= 0) { settings.noSpend.splice(i, 1); saveSettings(); updateSub(); toast('已取消標記'); return; }
  settings.noSpend.push(t); saveSettings(); updateSub();
  act('stretch', 'cool'); toast('已標記：今天沒有花錢 🍃'); say(getLine('nospend')); checkAch();
}

const LEVELS = [[0, '見習記帳員'], [5, '記帳新手'], [12, '小有心得'], [22, '理財達人'], [34, '錢包好伴侶'], [44, '心靈守護者']];
function levelOf(n) {
  let k = 0; LEVELS.forEach((l, i) => { if (n >= l[0]) k = i; });
  return { i: k + 1, t: LEVELS[k][1] };
}

function stats() {
  const exp = entries.filter(e => e.type === 'expense'), inc = entries.filter(e => e.type === 'income');
  const si = streakInfo(), c = { n: entries.length, nInc: inc.length, streak: si.best, f: settings.flags };
  const byDate = {};
  entries.forEach(e => { const o = byDate[e.date] = byDate[e.date] || { n: 0, exp: 0, cur: new Set() }; o.n++; if (e.type === 'expense') o.exp++; o.cur.add(e.cur); });
  const vals = Object.values(byDate);
  c.days = vals.length; c.maxDayN = Math.max(0, ...vals.map(o => o.n)); c.mixDay = vals.some(o => o.cur.size > 1);
  const ns = settings.noSpend.filter(d => !(byDate[d] && byDate[d].exp)).sort();
  c.ns = ns.length; c.nsRun = 0;
  let run = 0, prev = null;
  ns.forEach(d => { run = prev && daysBetween(prev, d) === 1 ? run + 1 : 1; if (run > c.nsRun) c.nsRun = run; prev = d; });
  c.nHkd = entries.filter(e => e.cur === 'HKD').length;
  c.nCny = entries.filter(e => e.cur === 'CNY').length;
  c.notes = entries.filter(e => e.note).length;
  c.renamed = petName() !== '小克';
  
  const M = {};
  entries.forEach(e => { const k = e.date.slice(0, 7); const o = M[k] = M[k] || { exp: 0, inc: 0, d: new Set() }; if (e.type === 'expense') o.exp += val(e); else o.inc += val(e); o.d.add(e.date); });
  const nowK = ymd(new Date()).slice(0, 7), cur = M[nowK];
  c.budget = settings.budget > 0 ? settings.budget : 0;
  const past = Object.keys(M).filter(k => k < nowK);
  const ok = c.budget ? past.filter(k => M[k].d.size >= 5 && M[k].exp <= c.budget) : [];
  c.pastOk = ok; c.pastOk2 = ok.some(k => ok.includes(nextMonth(k)));
  c.overPct = c.budget && cur ? (cur.exp - c.budget) / c.budget : 0;
  return c;
}

    <div class="lv"><span class="lvb">Lv.${lv.i}</span><span class="lvt">${esc(lv.t)}</span></div>
    <div class="pbar"><i style="width:${pct}%"></i></div>
    <div class="pnote">${todo ? `還有 ${todo} 個小祕密等著我們一起解鎖` : '全部都解鎖了，你真的太棒了！'}</div></div>
    <div class="body"><div class="agrid">${done.map(cardDone).join('')}${cardLock.repeat(todo)}</div></div>`;
  if (settings.achSeen !== n) { settings.achSeen = n; saveSettings(); }
  updateBadge();
}

/* ---------- 互動與事件綁定 ---------- */
function showTab(name) {
  ['add', 'report', 'ach', 'settings'].forEach(n => $('tab-' + n).hidden = n !== name);
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === name));
  if (name === 'report') { renderReport(); if (!settings.flags.report) { setFlag('report'); checkAch(); } }
  if (name === 'ach') renderAch();
  if (name === 'settings') renderSettings();
  updateSub(); updateBadge();
  window.scrollTo(0, 0);
}

document.querySelector('.tabbar').addEventListener('click', e => { const b = e.target.closest('button'); if (b) showTab(b.dataset.tab); });
$('typeSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setType(b.dataset.v); });$('curSeg').addEventListener('click', e => { const b = e.target.closest('button'); if (b) setCur(b.dataset.v); });
$('amount').addEventListener('input', () => { if (petMood !== 'sleep') look('d', 1600); });$('note').addEventListener('input', renderQuick);

$('chips').addEventListener('click', e => { const b = e.target.closest('.chip'); if (b) { form.cat = b.dataset.c; renderChips(); } });$('quick').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.qadd) {
    const note = $('note').value.trim();
    if (!form.cat || !note) return;
    (settings.quick[form.cat] = settings.quick[form.cat] || []).push(note);
    settings.dismissed = settings.dismissed.filter(k => k !== form.cat + '|' + note); saveSettings();
    toast(`已加入「${form.cat}」常用備註`); checkAch();
  } else if (b.dataset.q) {
    $('note').value =$('note').value.trim() === b.dataset.q ? '' : b.dataset.q;
  }
  renderQuick();
});

$('save').addEventListener('click', saveEntry);$('del').addEventListener('click', deleteEntry);
$('cancel').addEventListener('click', resetForm);$('nospend').addEventListener('click', toggleNoSpend);

let tapTimes = [];
$('pet').addEventListener('click', () => {
  const f = settings.flags; f.taps = (f.taps || 0) + 1; saveSettings();
  const now = Date.now(); tapTimes = tapTimes.filter(t => now - t < 2200); tapTimes.push(now);
  const st = petState(), fat = st.mood.indexOf('full') === 0;

  if (tapTimes.length >= 6) {
    act('dizzy'); tapTimes = [];
    say(getLine('dizzy'));
  } else if (st.mood === 'sleep') {
    act('jump'); setFace('wow', 800);
    say(getLine('tapSleep'));
  } else if (fat) {
    act('jiggle'); setFace('grin', 1300);
    say(getLine('tapFat'));
  } else {
    const r = Math.random();
    if (r < .3) { act('jump'); setFace('love', 2200); }
    else if (r < .55) act('wave');
    else if (r < .75) { act('jump'); setFace('wink', 1200); }
    else if (r < .9) { act('jiggle'); setFace('grin', 1300); }
    else act('cheer');
    say(getLine('tap'));
  }
  if (f.taps === 10 || f.taps === 100) checkAch();
});

document.addEventListener('pointerdown', ev => {
  if ($('tab-add').hidden || petMood === 'sleep' || modalOpen) return;
  const r = $('pet').getBoundingClientRect(), dx = ev.clientX - (r.left + r.width / 2), dy = ev.clientY - (r.top + r.height / 2);
  if (Math.abs(dx) < 40 && Math.abs(dy) < 60) return;
  look(Math.abs(dy) > 120 ? 'd' : dx < 0 ? 'l' : 'r', 1100);
});

$('modal').addEventListener('click', e => { if (e.target.id === 'modal' || e.target.id === 'mok') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && modalOpen) closeModal(); });

$('tab-report').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.mode) { rep.mode = b.dataset.mode; renderReport(); }
  else if (b.dataset.nav) { if (b.dataset.nav === 'today') rep.anchor = new Date(); else shift(+b.dataset.nav); renderReport(); }
  else if (b.dataset.d) { rep.mode = 'day'; rep.anchor = new Date(b.dataset.d + 'T00:00:00'); renderReport(); window.scrollTo(0, 0); }
  else if (b.dataset.id) startEdit(b.dataset.id);
});

$('tab-ach').addEventListener('click', e => {
  const b = e.target.closest('.acard'); if (!b) return;
  const a = ACH.find(x => x.id === b.dataset.a);
  if (a && settings.ach[a.id]) openModal(a, [], false); else toast(getLine('lockedTap'));
});

$('tab-settings').addEventListener('change', e => {
  if (e.target.id === 'setBudget') {
    const v = parseFloat(e.target.value); settings.budget = v > 0 ? v : 0; saveSettings(); updateSub();
    toast(settings.budget ? '每月預算已儲存' : '已取消預算'); checkAch();
  } else if (e.target.id === 'setPet') {
    settings.petName = e.target.value.trim() || '小克'; e.target.value = settings.petName; saveSettings(); updateSub();
    toast(`伴侶名字已更新為「${settings.petName}」`); renderSettings(); checkAch();
  } else if (e.target.id === 'setRate') {
    const v = parseFloat(e.target.value);
    if (v > 0) {
      settings.hkdToRmb = Math.round(v * 1e4) / 1e4; saveSettings();
      toast('匯率已儲存');
    } else e.target.value = settings.hkdToRmb;
  }
});

$('tab-settings').addEventListener('click', e => {
  const b = e.target.closest('button[data-act]'); if (!b) return;
  const act = b.dataset.act, t = b.dataset.t;
  if (act === 'fetchRate') fetchRate(true);
  else if (act === 'export') { if (!entries.length && !settings.noSpend.length) toast('目前還沒有記錄可匯出'); else exportCsv(); }
  else if (act === 'import') $('file').click();
  else if (act === 'qsel') { qSel = b.dataset.c; renderSettings(); }
  else if (act === 'qadd') {
    const v = $('newq').value.trim(); if (!v) return;
    const l = settings.quick[qSel] = settings.quick[qSel] || [];
    if (l.includes(v)) { toast('已經有這個常用備註囉'); return; }
    l.push(v); settings.dismissed = settings.dismissed.filter(k => k !== qSel + '|' + v); saveSettings(); renderSettings(); renderQuick(); checkAch();
  } else if (act === 'qdel') {
    settings.quick[qSel] = (settings.quick[qSel] || []).filter(q => q !== b.dataset.q);
    settings.dismissed.push(qSel + '|' + b.dataset.q); saveSettings(); renderSettings(); renderQuick();
  } else if (act === 'addcat') {
    const v = $('newcat-' + t).value.trim(); if (!v) return;
    if (settings.cats[t].includes(v)) { toast('該分類已存在'); return; }
    settings.cats[t].push(v); saveSettings(); renderSettings(); renderChips();
  } else if (act === 'delcat') {
    if (settings.cats[t].length <= 1) { toast('至少要保留一個分類喔'); return; }
    settings.cats[t] = settings.cats[t].filter(c => c !== b.dataset.c); saveSettings(); renderSettings(); renderChips();
  } else if (act === 'clear') {
    if (confirm(`確定要清除全部 ${entries.length} 筆帳目嗎？此操作無法復原，建議先匯出 CSV 備份。`)) {
      entries = []; settings.noSpend = []; saveEntries(); saveSettings(); renderSettings(); updateSub(); toast('所有帳目已清除');
    }
  }
});

$('file').addEventListener('change', e => {
  const f = e.target.files[0]; if (!f) return;
  const r = new FileReader(); r.onload = () => importCsv(String(r.result)); r.readAsText(f); e.target.value = '';
});

/* ---------- 初始化 ---------- */
$('date').value = ymd(new Date());
setType('expense');
setCur('HKD');
updateSub();

{
  const st = petState();
  if (st.mood === 'sleep') setFlag('woke');
  setTimeout(() => {
    say(moodLine(st), 6800);
    act(st.mood === 'sleep' ? 'yawn' : 'wave');
    checkAch();
  }, 500);
}
scheduleIdle();
updateBadge();

if (!settings.rateUpdated || Date.now() - settings.rateUpdated > 6 * 3600 * 1000) {
  fetchRate(false);
}
})();
</script>
</body>
</html>
